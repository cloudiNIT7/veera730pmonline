<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login · Cloud INIT</title>
<style>
  :root{
    --sky:#7fb8d4;
    --fur:#1a2b38;
    --line:#3a5e77;
    --ink:#eaf4fb;
    --paper:#0f1a24;
    --accent:#4aa3c7;
    --accent-dark:#2a6d8c;
    --accent2:#5ec8d8;
    --danger:#e57373;
    --glass:rgba(18,32,44,0.55);
    --glass-brd:rgba(120,190,220,0.22);
    --muted:#8fb0c4;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; width:100%; height:100vh; min-height:100vh;
    font-family:'Segoe UI', system-ui, -apple-system, sans-serif;
    display:flex; align-items:center; justify-content:center;
    overflow:hidden;
    position:relative;
  }

  /* Background image — fills the entire screen edge to edge */
  body::before{
    content:"";
    position:fixed; top:0; left:0; right:0; bottom:0; z-index:-2;
    width:100vw; height:100vh;
    background-image:url("https://images.unsplash.com/photo-1511300636408-a63a89df3482?q=80&w=1740&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D");
    background-size:cover;
    background-position:center center;
    background-repeat:no-repeat;
    filter:brightness(1.45) contrast(1.1) saturate(1.15);
  }

  #particles{ position:fixed; inset:0; z-index:0; will-change:transform; transform:translateZ(0); }

  .card-wrap{
    position:relative; z-index:1;
    width:440px;
    perspective:1200px;
  }
  .glow-border{ display:none; }

  form{
    position:relative; z-index:1;
    width:100%;
    background:rgba(18,32,44,0.35);
    backdrop-filter:blur(22px) saturate(140%);
    -webkit-backdrop-filter:blur(22px) saturate(140%);
    border:1px solid rgba(255,255,255,0.18);
    border-radius:22px;
    padding:36px 42px 42px;
    box-shadow:0 8px 32px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.12);
    transform:translateZ(0);
    backface-visibility:hidden;
    -webkit-font-smoothing:antialiased;
  }
  form label, form .subtitle, form .footnote{ text-shadow:0 1px 4px rgba(0,0,0,0.7); }
  .card-wrap{ transform:translateZ(0); }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:0.001ms !important; animation-iteration-count:1 !important; transition-duration:0.001ms !important; }
  }

  .brand{
    display:flex; align-items:center; justify-content:center; gap:9px;
    margin:0 0 6px;
  }
  .brand-mark{
    width:26px; height:26px; border-radius:8px;
    background:linear-gradient(135deg, var(--accent2), var(--accent));
    box-shadow:0 4px 14px rgba(47,102,144,0.45);
    position:relative;
  }
  .brand-mark::after{
    content:""; position:absolute; inset:6px;
    border:2px solid #fff; border-radius:4px; opacity:0.85;
  }
  .brand-name{
    font-size:15px; font-weight:800; letter-spacing:.06em;
    background:linear-gradient(135deg, var(--accent-dark), var(--accent), var(--accent2));
    -webkit-background-clip:text; background-clip:text; color:transparent;
    text-transform:uppercase;
  }

  h1{
    text-align:center;
    font-size:27px;
    font-weight:700;
    letter-spacing:-0.01em;
    color:var(--ink);
    margin:0 0 4px;
  }
  h1 .char{ display:inline-block; }
  .subtitle{
    text-align:center;
    font-size:14px;
    color:var(--muted);
    margin:0 0 16px;
  }
  label{ display:block; font-weight:600; color:var(--ink); font-size:14.5px; margin:16px 0 7px; letter-spacing:.01em; }
  .field{ position:relative; }
  input[type="text"], input[type="password"], input[type="email"]{
    width:100%; padding:14px 16px;
    border:1.5px solid rgba(255,255,255,0.22);
    border-radius:12px;
    background:rgba(255,255,255,0.08);
    backdrop-filter:blur(12px) saturate(140%);
    -webkit-backdrop-filter:blur(12px) saturate(140%);
    box-shadow:inset 0 1px 0 rgba(255,255,255,0.15), 0 2px 8px rgba(0,0,0,0.12);
    font-size:16px; color:var(--ink);
    outline:none;
    transition:border-color .2s, background .2s, box-shadow .2s;
  }
  input[type="text"]:focus, input[type="password"]:focus, input[type="email"]:focus{
    border-color:var(--accent2);
    background:rgba(255,255,255,0.14);
    box-shadow:0 0 0 3px rgba(94,200,216,0.18), inset 0 1px 0 rgba(255,255,255,0.2);
  }
  input::placeholder{ color:#5f7d90; }
  .field-line{
    position:absolute; left:0; bottom:0; height:2px; width:100%;
    background:var(--accent); border-radius:2px;
    transform:scaleX(0); transform-origin:left;
  }
  .password-container{ position:relative; }

  button{
    position:relative;
    width:100%; margin-top:26px; padding:15px;
    border:none; border-radius:12px;
    background:linear-gradient(135deg, var(--accent2), var(--accent), var(--accent-dark));
    background-size:200% 200%;
    color:#fff;
    font-size:16.5px; font-weight:700; letter-spacing:.01em; cursor:pointer;
    overflow:hidden;
    box-shadow:0 10px 26px rgba(47,102,144,0.4);
    will-change:transform;
    transition:transform .18s ease, box-shadow .18s ease;
  }
  button:hover:not(:disabled){ transform:translateY(-2px); box-shadow:0 16px 34px rgba(74,163,199,0.5); }
  button:active:not(:disabled){ transform:translateY(0); box-shadow:0 8px 20px rgba(47,102,144,0.4); }
  button:disabled{ cursor:not-allowed; opacity:0.85; }
  .btn-label{ position:relative; z-index:1; display:inline-flex; align-items:center; justify-content:center; gap:10px; }
  .spinner{
    width:16px; height:16px; border-radius:50%;
    border:2px solid rgba(255,255,255,0.4); border-top-color:#fff;
    display:none;
  }
  .spinner.active{ display:inline-block; }

  .footnote{
    text-align:center; font-size:13px; color:var(--muted); margin-top:18px;
  }

  /* --- creature --- */
  .svgContainer{
    width:250px; margin:0 auto 14px;
    filter:drop-shadow(0 8px 16px rgba(28,46,58,0.18));
    background:rgba(255,255,255,0.06);
    backdrop-filter:blur(10px) saturate(140%);
    -webkit-backdrop-filter:blur(10px) saturate(140%);
    border:1px solid rgba(255,255,255,0.14);
    border-radius:50%;
    padding:8px;
  }
  #mouthSmallBG, #mouthMediumBG, #mouthLargeBG{ opacity:0; }
  .arms{ filter:drop-shadow(0 3px 6px rgba(28,46,58,0.25)); }
  .armL path, .armR path{ stroke-width:2.5; }
  #armL, #armR, #head, #headSway{ will-change:transform; }
  .body{ will-change:transform; }
</style>
</head>

<script>
  // ── Particle field background ──
  (function initParticles(){
    const canvas = document.getElementById('particles');
    if (!canvas) return; // canvas removed — no particles
    const ctx = canvas.getContext('2d', { alpha: true, desynchronized: true });
    let w, h, particles, dpr;

    // Honour reduced-motion: draw one static frame and stop.
    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    // Scale particle count to the screen so small / low-power devices
    // aren't asked to run the same load as a big desktop.
    const area = window.innerWidth * window.innerHeight;
    const COUNT = Math.max(20, Math.min(46, Math.round(area / 40000)));
    const LINK_DIST = 96;
    const LINK_DIST_SQ = LINK_DIST * LINK_DIST; // compare squared distances, no sqrt

    function resize(){
      dpr = Math.min(window.devicePixelRatio || 1, 2); // cap DPR at 2 — retina-crisp without wasting fill
      w = window.innerWidth;
      h = window.innerHeight;
      canvas.width  = Math.floor(w * dpr);
      canvas.height = Math.floor(h * dpr);
      canvas.style.width  = w + 'px';
      canvas.style.height = h + 'px';
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0); // draw in CSS pixels, render at device resolution
    }
    function makeParticles(){
      particles = Array.from({ length: COUNT }, () => ({
        x: Math.random() * w,
        y: Math.random() * h,
        r: Math.random() * 1.6 + 0.4,
        vx: (Math.random() - 0.5) * 0.25,
        vy: (Math.random() - 0.5) * 0.25,
        a: Math.random() * 0.5 + 0.15
      }));
    }
    resize(); makeParticles();

    // Debounce resize so a drag-resize doesn't rebuild the field every frame.
    let resizeTimer;
    window.addEventListener('resize', () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => { resize(); makeParticles(); if (reduceMotion) drawStatic(); }, 150);
    });

    // Pause the whole loop when the tab isn't visible — saves battery,
    // and prevents a huge stutter-burst of queued frames on return.
    let running = true;
    document.addEventListener('visibilitychange', () => {
      running = !document.hidden;
      if (running && !reduceMotion) requestAnimationFrame(tick);
    });

    // Cap the simulation to ~40fps. The motion is slow drifting dust, so
    // fewer, evenly-spaced frames look identical but free up the main
    // thread for the GSAP creature — which is what the eye actually tracks.
    const FRAME_MS = 1000 / 40;
    let lastTime = 0;

    function render(){
      ctx.clearRect(0, 0, w, h);
      for (const p of particles){
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(169,221,243,${p.a})`;
        ctx.fill();
      }
      // faint connecting lines for nearby particles — compared with
      // squared distance so we never call Math.sqrt in the hot loop.
      ctx.lineWidth = 1;
      for (let i = 0; i < particles.length; i++){
        const a = particles[i];
        for (let j = i + 1; j < particles.length; j++){
          const b = particles[j];
          const dx = a.x - b.x, dy = a.y - b.y;
          const distSq = dx * dx + dy * dy;
          if (distSq < LINK_DIST_SQ){
            const t = 1 - distSq / LINK_DIST_SQ; // cheap falloff, avoids sqrt
            ctx.beginPath();
            ctx.moveTo(a.x, a.y);
            ctx.lineTo(b.x, b.y);
            ctx.strokeStyle = `rgba(94,200,216,${0.12 * t})`;
            ctx.stroke();
          }
        }
      }
    }

    function step(){
      for (const p of particles){
        p.x += p.vx; p.y += p.vy;
        if (p.x < 0) p.x = w; else if (p.x > w) p.x = 0;
        if (p.y < 0) p.y = h; else if (p.y > h) p.y = 0;
      }
    }

    function drawStatic(){ render(); }

    function tick(now){
      if (!running) return;
      requestAnimationFrame(tick);
      if (now - lastTime < FRAME_MS) return; // throttle to target fps
      lastTime = now;
      step();
      render();
    }

    if (reduceMotion){
      drawStatic(); // one calm frame, no animation loop at all
    } else {
      requestAnimationFrame(tick);
    }
  })();

  // Ambient blob drift & animated button gradient removed as continuous
  // loops — they kept the compositor (and the card's backdrop-blur behind
  // them) repainting nonstop. The blobs stay as static soft glows for depth.

  // ── Entrance animation (guarded) ──
  // Only hide-then-reveal if GSAP is actually available. If the GSAP CDN is
  // blocked or slow, we skip the animation entirely so the form is never
  // left stuck invisible — it just appears immediately.
  if (window.gsap) {
    gsap.set('form', { opacity: 0, y: 24, scale: 0.97 });
    gsap.set('.svgContainer', { opacity: 0, y: -12 });
    gsap.set('.subtitle, .field, button, .footnote', { opacity: 0, y: 14 });

    const tl = gsap.timeline({ defaults: { ease: 'power3.out' } });
    tl.to('form', { opacity: 1, y: 0, scale: 1, duration: 0.6 })
      .to('.svgContainer', { opacity: 1, y: 0, duration: 0.5 }, '-=0.35')
      .to('.subtitle', { opacity: 1, y: 0, duration: 0.4 }, '-=0.2')
      .to('.field', { opacity: 1, y: 0, duration: 0.4, stagger: 0.1 }, '-=0.2')
      .to('button', { opacity: 1, y: 0, duration: 0.4 }, '-=0.15')
      .to('.footnote', { opacity: 1, y: 0, duration: 0.4 }, '-=0.2');
  }

  // (animated button gradient loop removed — see note above)

  // ── 3D tilt parallax on the card, following the cursor ──
  // 3D card tilt removed: tilting a backdrop-blurred card forces the browser
  // to re-rasterize the blur on every frame, which is the main source of lag.
  // The card now stays crisp and still — the creature carries the motion.
  const cardWrap = document.getElementById('cardWrap');
  const prefersReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const finePointer = window.matchMedia('(hover: hover) and (pointer: fine)').matches;

  // ── Magnetic button ──
  // Magnetic button removed too — same repaint problem. A pure-CSS hover
  // lift (below, in the stylesheet) gives the same premium feel for free.
</script>

  // --- creature animation wiring (GSAP) ---
  const eyeL = document.getElementById('eyeL');

  const armL = document.getElementById('armL');
  const armR = document.getElementById('armR');
  const mouthSmall = document.getElementById('mouthSmallBG');

  const eyeQuickL = gsap.quickTo(eyeL, 'x', { duration: 0.25, ease: 'power2.out' });
  const eyeQuickR = gsap.quickTo(eyeR, 'x', { duration: 0.25, ease: 'power2.out' });

  // Head rotation removed: the head no longer sways idly or tilts toward

  // origin is still set so the scripted reaction beats (bashful tuck on

  gsap.set(head, { transformOrigin: '100px 90px' });
  gsap.set(headSway, { transformOrigin: '100px 100px' });

  // No-op stubs so the eye-follow handlers that used to also move the head

  const headTiltX = () => {};
  const headTiltY = () => {};

  // Focus glow lines under inputs
  gsap.set([emailLine, passLine], { scaleX: 0 });
  const showLine = (line) => gsap.to(line, { scaleX: 1, duration: 0.3, ease: 'power2.out' });
  const hideLine = (line) => gsap.to(line, { scaleX: 0, duration: 0.25, ease: 'power2.in' });

  emailInput.addEventListener('focus', () => { emailFocused = true; showLine(emailLine); });
  emailInput.addEventListener('blur', () => {
    emailFocused = false;
    hideLine(emailLine);
  });
  passwordInput.addEventListener('focus', () => showLine(passLine));
  passwordInput.addEventListener('blur', () => hideLine(passLine));

  // Idle cursor-follow for the eyes (paused while typing the email or
  // while the password field is focused, so it never fights those states)
  let emailFocused = false;
  // Cache the SVG rect (refreshed on scroll/resize) instead of forcing a
  // layout read on every mousemove, and coalesce updates to one per frame.
  let svgRect = eyeL.closest('svg').getBoundingClientRect();
  const refreshSvgRect = () => { svgRect = eyeL.closest('svg').getBoundingClientRect(); };
  window.addEventListener('resize', refreshSvgRect, { passive: true });
  window.addEventListener('scroll', refreshSvgRect, { passive: true });

  let lastMx = 0, lastMy = 0, eyeQueued = false;
  function applyEyes(){
    eyeQueued = false;
    if (emailFocused || document.activeElement === passwordInput) return;
    const cx = svgRect.left + svgRect.width / 2;
    const cy = svgRect.top + svgRect.height / 2;
    const tx = Math.max(-1, Math.min(1, (lastMx - cx) / 260));
    const ty = Math.max(-1, Math.min(1, (lastMy - cy) / 260));
    eyeQuickL(tx * 5);
    eyeQuickR(tx * 5);
    // Head follows more subtly and with more rounding — slower, heavier
    // secondary motion behind the quick eye dart (overlapping action).
    headTiltX(tx * 6);
    headTiltY(ty * 3);
  }
  document.addEventListener('mousemove', (e) => {
    if (emailFocused || document.activeElement === passwordInput) return;
    lastMx = e.clientX; lastMy = e.clientY;
    if (!eyeQueued){ eyeQueued = true; requestAnimationFrame(applyEyes); }
  }, { passive: true });

  // Eyes glance across as you type the email, head tilts curiously along with it
  emailInput.addEventListener('input', () => {
    const t = Math.max(-1, Math.min(1, (emailInput.value.length / 24) * 2 - 1));
    const dx = t * 6;
    eyeQuickL(dx);
    eyeQuickR(dx);
    headTiltX(dx * 0.8);
  });

  let currentMouth = mouthSmall;
  function crossfadeMouth(next) {
    if (next === currentMouth) return;
    gsap.to(currentMouth, { opacity: 0, duration: 0.2, ease: 'power1.out' });
    gsap.to(next, { opacity: 1, duration: 0.25, ease: 'power1.out' });
    currentMouth = next;
  }
  function updateMouth() {
    const len = passwordInput.value.length;
    if (len === 0) crossfadeMouth(mouthSmall);
    else if (len < 6) crossfadeMouth(mouthMedium);
    else crossfadeMouth(mouthLarge);
  }
  gsap.set(mouthSmall, { opacity: 1 });

  gsap.set(armL, { y: 95, rotation: -6, transformOrigin: '50% 100%' });
  gsap.set(armR, { y: 95, rotation: 6, transformOrigin: '50% 100%' });

  let bothHandsTl;

  // The arms travel along real curved paths (MotionPathPlugin) instead of
  // faking an arc out of separate x/y/rotation tweens — the paw genuinely
  // sweeps up and inward on a bezier curve, same technique used for
  // realistic character-rig limb motion.
  const armLUpPath  = [{ x: 0, y: 95 }, { x: 14, y: 46 }, { x: 0, y: 0 }];
  const armRUpPath   = [{ x: 0, y: 95 }, { x: -14, y: 46 }, { x: 0, y: 0 }];
  const armLDownPath = [{ x: 0, y: 0 }, { x: 18, y: 40 }, { x: 0, y: 95 }];
  const armRDownPath = [{ x: 0, y: 0 }, { x: -18, y: 40 }, { x: 0, y: 95 }];

  function coverEyes() {
    bothHandsTl = gsap.timeline({ defaults: { overwrite: 'auto' } });
    bothHandsTl
      // 1. Anticipation — a tiny pull-back before the real motion, like a
      //    real arm loading up energy before it moves.
      .to(armL, { y: '+=10', rotation: -16, duration: 0.08, ease: 'power1.out' }, 0)
      .to(armR, { y: '+=10', rotation: 16, duration: 0.08, ease: 'power1.out' }, 0.03)
      // 2. Real curved swing along the motion path, autoRotate lets the
      //    paw's own angle track the tangent of the curve as it travels.
      .to(armL, { motionPath: { path: armLUpPath, autoRotate: false }, rotation: 0, duration: 0.4, ease: 'handSwing' }, 0.08)
      .to(armR, { motionPath: { path: armRUpPath, autoRotate: false }, rotation: 0, duration: 0.4, ease: 'handSwing' }, 0.12)
      // 3. Soft settle — one gentle ease into place, no repeating wobble
      //    so the hands come to rest smoothly instead of shaking.
      .to(armL, { skewX: 0, rotation: 0, duration: 0.35, ease: 'power2.out' }, 0.48)
      .to(armR, { skewX: 0, rotation: 0, duration: 0.35, ease: 'power2.out' }, 0.5)
      // 4. The head tucks in bashfully once the eyes are hidden.
      .to(head, { rotation: 3, y: 4, duration: 0.4, ease: 'power3.out', overwrite: 'auto' }, 0.12);
  }

  function uncoverEyes() {
    bothHandsTl = gsap.timeline({ defaults: { overwrite: 'auto' } });
    bothHandsTl
      // 1. A shy little peek outward before pulling away.
      .to(armL, { rotation: -10, skewX: 0, duration: 0.12, ease: 'power1.inOut' }, 0)
      .to(armR, { rotation: 10, skewX: 0, duration: 0.12, ease: 'power1.inOut' }, 0.02)
      // 2. Curved drop away, left hand leading slightly.
      .to(armL, { motionPath: { path: armLDownPath, autoRotate: false }, rotation: -6, duration: 0.42, ease: 'handDrop' }, 0.12)
      .to(armR, { motionPath: { path: armRDownPath, autoRotate: false }, rotation: 6, duration: 0.42, ease: 'handDrop' }, 0.16)
      // 3. Head lifts back up out of its bashful tuck.
      .to(head, { rotation: 0, y: 0, duration: 0.55, ease: 'elastic.out(1, 0.65)', overwrite: 'auto' }, 0.14);

  //    peek once the password is 5-7 characters, then both hands clamp
  //    back down once it reaches 8+. This uses its own timeline (armRTl)
  //    that only ever touches armR — it never kills bothHandsTl, so a fast
  //    typist can't interrupt the initial cover-eyes animation mid-flight
  //    and leave the left arm or head frozen partway through a move. Every
  //    individual tween below carries its own overwrite:'auto', so GSAP
  //    still cleanly resolves conflicts on armR specifically without
  //    touching anything else. ──
  let armRTl;
  let handState = 'open'; // 'open' | 'closed' | 'peek'

  function peekOneHand() {
    armRTl = gsap.timeline({ defaults: { overwrite: 'auto' } });
    armRTl
      .to(armR, { rotation: 12, duration: 0.1, ease: 'power1.inOut' }, 0)
      .to(armR, { y: 95, rotation: 6, duration: 0.3, ease: 'power2.in' }, 0.1);
  }

  function closeBothHands() {
    armRTl = gsap.timeline({ defaults: { overwrite: 'auto' } });
    armRTl
      .to(armR, { y: 108, rotation: 16, duration: 0.08, ease: 'power1.out' }, 0)
      .to(armR, { y: -6, rotation: 3, duration: 0.22, ease: 'power3.out' }, 0.08)
      .to(armR, { y: 0, rotation: 0, skewX: 0, duration: 0.28, ease: 'power2.out' }, 0.3);
  }

  function updatePeekState() {
    const len = passwordInput.value.length;
    const desired = (len >= 5 && len <= 7) ? 'peek' : 'closed';
    if (desired === handState) return;
    if (desired === 'peek') peekOneHand();
    else closeBothHands();
    handState = desired;
  }

  passwordInput.addEventListener('blur', () => { handState = 'open'; });
  passwordInput.addEventListener('input', updatePeekState);

  // ── Idle breathing on the body while nothing is focused ──
  gsap.to('.body', { y: -2, duration: 2.2, ease: 'sine.inOut', yoyo: true, repeat: -1, transformOrigin: '50% 100%' });

  passwordInput.addEventListener('focus', coverEyes);
  passwordInput.addEventListener('blur', uncoverEyes);
  passwordInput.addEventListener('input', updateMouth);

  function setLoading(isLoading, label) {
    loginBtn.disabled = isLoading;
    spinner.classList.toggle('active', isLoading);
    btnText.textContent = label || (isLoading ? 'Logging in…' : 'Login');
    if (!isLoading && window.gsap) gsap.fromTo(loginBtn, { scale: 0.97 }, { scale: 1, duration: 0.25, ease: 'back.out(2)' });
  }

  function shakeForm() {
    if (!window.gsap) return;
    gsap.fromTo('form',
      { x: 0 },
      { x: 10, duration: 0.06, repeat: 5, yoyo: true, ease: 'power1.inOut',

  function successPulse() {
    if (!window.gsap) return Promise.resolve();
    return gsap.timeline()
      .to(head, { rotation: -7, duration: 0.16, ease: 'power2.out', overwrite: 'auto' })
      .to(head, { rotation: 5, duration: 0.18, ease: 'power1.inOut' })
      .to(head, { rotation: 0, duration: 0.35, ease: 'elastic.out(1, 0.7)' })
      .to('form', { scale: 1.02, duration: 0.15, ease: 'power2.out' }, 0)
      .to('form', { opacity: 0, y: -16, duration: 0.35, ease: 'power2.in' }, '+=0.1');
  }

  const withTimeout = (promise, ms, timeoutErr) => {
    let timer;
    const timeout = new Promise((_, reject) => {
      timer = setTimeout(() => reject(timeoutErr), ms);
    });
    return Promise.race([promise, timeout]).finally(() => clearTimeout(timer));
  };
  const TIMEOUT_ERR = Object.assign(new Error('timeout'), { code: 'app/timeout' });

  // ── Single-device login: friendly device label for the doc we stamp ──
  function detectDeviceLabel() {
    const ua = navigator.userAgent || '';
    if (/iPhone/i.test(ua)) return 'an iPhone';
    if (/iPad/i.test(ua)) return 'an iPad';
    if (/Android/i.test(ua)) return 'an Android device';
    if (/Macintosh/i.test(ua)) return 'a Mac';
    if (/Windows/i.test(ua)) return 'a Windows PC';
    if (/Linux/i.test(ua)) return 'a Linux device';
    return 'another device';
  }

  loginForm.addEventListener('submit', async (e) => {
    e.preventDefault();

    const rawEmail = emailInput.value.trim();
    const pass = passwordInput.value;

    if (!rawEmail || !pass) {
      shakeForm();
      alert('Please enter your email and password.');
      return;
    }
    if (pass.length < 6) {
      shakeForm();
      alert('Password must be at least 6 characters.');
      return;
    }

    setLoading(true, 'Checking…');

    try {
      // Persistence: sessions stay signed in across browser restarts.
      await withTimeout(setPersistence(auth, browserLocalPersistence), 15000, TIMEOUT_ERR);

      const userCred = await withTimeout(
        signInWithEmailAndPassword(auth, rawEmail, pass),
        15000, TIMEOUT_ERR
      );

      // ── Single-device login enforcement ──
      // Every fresh login mints a brand-new session id and stamps it onto
      // the user's Firestore doc. That doc is the single source of truth
      // for "which device is currently allowed to be logged in." Any other
      // page running sessionGuard.js watches this doc live and force-signs
      // itself out the moment it sees a session id that isn't its own —
      // so the previous device gets kicked automatically, and if a third
      // device logs in next, whichever device was active gets kicked too.
      const sessionId = (window.crypto && crypto.randomUUID)
        ? crypto.randomUUID()
        : `${Date.now().toString(36)}-${Math.random().toString(36).slice(2)}`;

      await withTimeout(
        setDoc(doc(db, 'veeraUsers', userCred.user.uid), {
          activeSessionId: sessionId,
          activeSessionAt: serverTimestamp(),
          activeDeviceLabel: detectDeviceLabel(),
          lastLogin: serverTimestamp()
        }, { merge: true }),
        15000, TIMEOUT_ERR
      ).catch(err => console.warn('session stamp failed (non-fatal):', err));

      localStorage.setItem('veeraSessionId', sessionId);

      setLoading(false, 'Success');
      btnText.textContent = 'Success ✓';
      await successPulse();
      window.location.href = 'dashboard.html';
    } catch (err) {
      console.error('Login failed:', err);
      setLoading(false);
      shakeForm();
      alert(friendlyLoginError(err));
    }
  });

  function friendlyLoginError(err) {
    const code = err && err.code;
    switch (code) {
      case 'app/timeout':
        return 'This is taking too long. Please check your internet connection and try again.';
      case 'auth/user-not-found':
        return 'This Veera Cloud account does not exist. Please check your email or sign up.';
      case 'auth/wrong-password':
      case 'auth/invalid-credential':
      case 'auth/invalid-login-credentials':
        return 'Wrong username or password. Please try again.';
      case 'auth/invalid-email':
        return 'That email address doesn\'t look right. Please check and try again.';
      case 'auth/user-disabled':
        return 'This account has been disabled. Please contact Veera Cloud support.';
      case 'auth/too-many-requests':
        return 'Too many attempts. Please wait a moment and try again.';
      case 'auth/network-request-failed':
        return 'Network error. Please check your internet connection and try again.';
      case 'auth/operation-not-allowed':
        return 'Email/password sign-in isn\'t enabled for this app yet. Please contact Veera Cloud support.';
      case 'auth/unauthorized-domain':
        return 'This website isn\'t authorized for login yet. Please contact Veera Cloud support.';
      case 'permission-denied':
      case 'unavailable':
      case 'not-found':
        return 'Login succeeded, but we couldn\'t reach Veera Cloud\'s database. Please try again shortly.';
      default:
        return 'Login failed. Please try again.';
    }
  }
</script>
