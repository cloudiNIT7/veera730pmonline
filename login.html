<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login · Cloud INIT</title>
<style>
  :root{
    --sky:#a9ddf3;
    --fur:#ddf1fa;
    --line:#3a5e77;
    --ink:#1c2e3a;
    --paper:#eef7fc;
    --accent:#2f6690;
    --accent-dark:#1c4560;
    --accent2:#5ec8d8;
    --danger:#c65b5b;
    --glass:rgba(255,255,255,0.68);
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; min-height:100%; width:100%;
    font-family:'Segoe UI', system-ui, -apple-system, sans-serif;
    display:flex; align-items:center; justify-content:center;
    background:
      radial-gradient(circle at 15% 20%, rgba(169,221,243,0.55), transparent 45%),
      radial-gradient(circle at 85% 80%, rgba(58,94,119,0.25), transparent 50%),
      linear-gradient(160deg, #0e1f2b 0%, #16324a 45%, #0c2436 100%);
    overflow:hidden;
    position:relative;
  }

  #particles{ position:fixed; inset:0; z-index:0; }

  /* ambient floating blobs for depth */
  .blob{
    position:fixed; border-radius:50%;
    filter:blur(70px); opacity:0.35; pointer-events:none; z-index:0;
  }
  .blob1{ width:360px; height:360px; background:#a9ddf3; top:-120px; left:-100px; }
  .blob2{ width:300px; height:300px; background:#5ec8d8; bottom:-100px; right:-80px; }
  .blob3{ width:220px; height:220px; background:#eef7fc; top:60%; left:70%; }

  .card-wrap{
    position:relative; z-index:1;
    width:440px;
    perspective:1200px;
  }
  .glow-border{
    position:absolute; inset:-2px; border-radius:24px;
    background:conic-gradient(from 200deg, var(--accent2), var(--accent), var(--sky), var(--accent2));
    filter:blur(10px); opacity:0.5;
    z-index:0;
  }

  form{
    position:relative; z-index:1;
    width:100%;
    background:var(--glass);
    backdrop-filter:blur(20px) saturate(170%);
    -webkit-backdrop-filter:blur(20px) saturate(170%);
    border:1px solid rgba(255,255,255,0.55);
    border-radius:22px;
    padding:36px 42px 42px;
    box-shadow:0 30px 70px rgba(5,15,25,0.4), 0 2px 8px rgba(5,15,25,0.15);
    transform-style:preserve-3d;
  }

  .brand{
    display:flex; align-items:center; justify-content:center; gap:9px;
    margin:0 0 6px;
  }
  .brand-mark{
    width:26px; height:26px; border-radius:8px;
    background:linear-gradient(135deg, var(--accent2), var(--accent));
    box-shadow:0 4px 14px rgba(47,102,144,0.45);
    position:relative;
  }
  .brand-mark::after{
    content:""; position:absolute; inset:6px;
    border:2px solid #fff; border-radius:4px; opacity:0.85;
  }
  .brand-name{
    font-size:15px; font-weight:800; letter-spacing:.06em;
    background:linear-gradient(135deg, var(--accent-dark), var(--accent), var(--accent2));
    -webkit-background-clip:text; background-clip:text; color:transparent;
    text-transform:uppercase;
  }

  h1{
    text-align:center;
    font-size:27px;
    font-weight:700;
    letter-spacing:-0.01em;
    color:var(--ink);
    margin:0 0 4px;
  }
  h1 .char{ display:inline-block; }
  .subtitle{
    text-align:center;
    font-size:14px;
    color:#5b7688;
    margin:0 0 16px;
  }
  label{ display:block; font-weight:600; color:var(--ink); font-size:14.5px; margin:16px 0 7px; letter-spacing:.01em; }
  .field{ position:relative; }
  input[type="text"], input[type="password"], input[type="email"]{
    width:100%; padding:14px 16px;
    border:1.5px solid rgba(58,94,119,0.25);
    border-radius:12px;
    background:rgba(255,255,255,0.75);
    font-size:16px; color:var(--ink);
    outline:none;
  }
  input::placeholder{ color:#9db3c0; }
  .field-line{
    position:absolute; left:0; bottom:0; height:2px; width:100%;
    background:var(--accent); border-radius:2px;
    transform:scaleX(0); transform-origin:left;
  }
  .password-container{ position:relative; }

  button{
    position:relative;
    width:100%; margin-top:26px; padding:15px;
    border:none; border-radius:12px;
    background:linear-gradient(135deg, var(--accent2), var(--accent), var(--accent-dark));
    background-size:200% 200%;
    color:#fff;
    font-size:16.5px; font-weight:700; letter-spacing:.01em; cursor:pointer;
    overflow:hidden;
    box-shadow:0 10px 26px rgba(47,102,144,0.4);
    will-change:transform;
  }
  button:disabled{ cursor:not-allowed; opacity:0.85; }
  .btn-label{ position:relative; z-index:1; display:inline-flex; align-items:center; justify-content:center; gap:10px; }
  .spinner{
    width:16px; height:16px; border-radius:50%;
    border:2px solid rgba(255,255,255,0.4); border-top-color:#fff;
    display:none;
  }
  .spinner.active{ display:inline-block; }

  .footnote{
    text-align:center; font-size:13px; color:#6d879a; margin-top:18px;
  }

  /* --- creature --- */
  .svgContainer{ width:250px; margin:0 auto 14px; filter:drop-shadow(0 8px 16px rgba(28,46,58,0.18)); }
  #mouthSmallBG, #mouthMediumBG, #mouthLargeBG{ opacity:0; }
  .arms{ filter:drop-shadow(0 3px 6px rgba(28,46,58,0.25)); }
  .armL path, .armR path{ stroke-width:2.5; }
</style>
</head>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/CustomEase.min.js"></script>
<script>
  gsap.registerPlugin(MotionPathPlugin, CustomEase);

  // A hand-tuned ease: quick, slightly overshooting lift-off that settles
  // with a soft, weighted landing — built specifically for the arm swing
  // rather than reused from a stock preset.
  CustomEase.create('handSwing', '0.34,0.02 0.22,1.28 0.36,1');
  CustomEase.create('handDrop', '0.5,0 0.7,0.15 0.3,1');
</script>
<script>
  // ── Particle field background ──
  (function initParticles(){
    const canvas = document.getElementById('particles');
    const ctx = canvas.getContext('2d');
    let w, h, particles;
    const COUNT = 70;

    function resize(){
      w = canvas.width = window.innerWidth;
      h = canvas.height = window.innerHeight;
    }
    function makeParticles(){
      particles = Array.from({ length: COUNT }, () => ({
        x: Math.random() * w,
        y: Math.random() * h,
        r: Math.random() * 1.6 + 0.4,
        vx: (Math.random() - 0.5) * 0.25,
        vy: (Math.random() - 0.5) * 0.25,
        a: Math.random() * 0.5 + 0.15
      }));
    }
    resize(); makeParticles();
    window.addEventListener('resize', () => { resize(); makeParticles(); });

    function tick(){
      ctx.clearRect(0, 0, w, h);
      for (const p of particles){
        p.x += p.vx; p.y += p.vy;
        if (p.x < 0) p.x = w; if (p.x > w) p.x = 0;
        if (p.y < 0) p.y = h; if (p.y > h) p.y = 0;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(169,221,243,${p.a})`;
        ctx.fill();
      }
      // faint connecting lines for nearby particles
      for (let i = 0; i < particles.length; i++){
        for (let j = i + 1; j < particles.length; j++){
          const a = particles[i], b = particles[j];
          const dx = a.x - b.x, dy = a.y - b.y;
          const dist = Math.sqrt(dx * dx + dy * dy);
          if (dist < 110){
            ctx.beginPath();
            ctx.moveTo(a.x, a.y);
            ctx.lineTo(b.x, b.y);
            ctx.strokeStyle = `rgba(94,200,216,${0.12 * (1 - dist / 110)})`;
            ctx.lineWidth = 1;
            ctx.stroke();
          }
        }
      }
      requestAnimationFrame(tick);
    }
    tick();
  })();

  // ── Ambient blob drift ──
  gsap.to('.blob1', { x: 40, y: 30, duration: 9, ease: 'sine.inOut', yoyo: true, repeat: -1 });
  gsap.to('.blob2', { x: -30, y: -25, duration: 11, ease: 'sine.inOut', yoyo: true, repeat: -1 });
  gsap.to('.blob3', { x: -20, y: 20, duration: 7, ease: 'sine.inOut', yoyo: true, repeat: -1 });

  // ── Entrance animation ──
  gsap.set('form', { opacity: 0, y: 24, scale: 0.97 });
  gsap.set('.svgContainer', { opacity: 0, y: -12 });
  gsap.set('.subtitle, .field, button, .footnote', { opacity: 0, y: 14 });

  const tl = gsap.timeline({ defaults: { ease: 'power3.out' } });
  tl.to('form', { opacity: 1, y: 0, scale: 1, duration: 0.6 })
    .to('.svgContainer', { opacity: 1, y: 0, duration: 0.5 }, '-=0.35')
    .to('.subtitle', { opacity: 1, y: 0, duration: 0.4 }, '-=0.2')
    .to('.field', { opacity: 1, y: 0, duration: 0.4, stagger: 0.1 }, '-=0.2')
    .to('button', { opacity: 1, y: 0, duration: 0.4 }, '-=0.15')
    .to('.footnote', { opacity: 1, y: 0, duration: 0.4 }, '-=0.2');

  // ── Animated gradient shift on button ──
  gsap.to('button', { backgroundPosition: '100% 50%', duration: 3, ease: 'sine.inOut', yoyo: true, repeat: -1 });

  // ── 3D tilt parallax on the card, following the cursor ──
  const cardWrap = document.getElementById('cardWrap');
  const tiltX = gsap.quickTo('form', 'rotationX', { duration: 0.5, ease: 'power3.out' });
  const tiltY = gsap.quickTo('form', 'rotationY', { duration: 0.5, ease: 'power3.out' });
  cardWrap.addEventListener('mousemove', (e) => {
    const rect = cardWrap.getBoundingClientRect();
    const px = (e.clientX - rect.left) / rect.width - 0.5;
    const py = (e.clientY - rect.top) / rect.height - 0.5;
    tiltX(-py * 6);
    tiltY(px * 6);
  });
  cardWrap.addEventListener('mouseleave', () => { tiltX(0); tiltY(0); });

  // ── Magnetic button ──
  const magBtn = document.querySelector('button[type="submit"]');
  const magX = gsap.quickTo(magBtn, 'x', { duration: 0.3, ease: 'power3.out' });
  const magY = gsap.quickTo(magBtn, 'y', { duration: 0.3, ease: 'power3.out' });
  magBtn.addEventListener('mousemove', (e) => {
    const rect = magBtn.getBoundingClientRect();
    magX((e.clientX - rect.left - rect.width / 2) * 0.25);
    magY((e.clientY - rect.top - rect.height / 2) * 0.35);
  });
  magBtn.addEventListener('mouseleave', () => { magX(0); magY(0); });
</script>

<script type="module">
  // ─── Real Firebase Authentication (no manual localStorage) ───
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-app.js";
  import {
    getAuth, setPersistence, browserLocalPersistence,
    signInWithEmailAndPassword
  } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-auth.js";
  import {
    getFirestore, doc, setDoc, serverTimestamp
  } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCFdcL1yRhonVFSMpLkZm2Cyqt2-NCHwBI",
    authDomain: "veera730pmonline.firebaseapp.com",
    projectId: "veera730pmonline",
    storageBucket: "veera730pmonline.firebasestorage.app",
    messagingSenderId: "570230262031",
    appId: "1:570230262031:web:63f3917d8197259bbcd67a",
    measurementId: "G-9V7EDX772E"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  const emailInput = document.getElementById('email');
  const passwordInput = document.getElementById('password');
  const loginForm = document.getElementById('login-form');
  const loginBtn = loginForm.querySelector('button[type="submit"]');
  const btnText = document.getElementById('btnText');
  const spinner = document.getElementById('spinner');
  const emailLine = document.getElementById('emailLine');
  const passLine = document.getElementById('passLine');

  // --- creature animation wiring (GSAP) ---
  const eyeL = document.getElementById('eyeL');
  const eyeR = document.getElementById('eyeR');
  const armL = document.getElementById('armL');
  const armR = document.getElementById('armR');
  const mouthSmall = document.getElementById('mouthSmallBG');
  const mouthMedium = document.getElementById('mouthMediumBG');
  const mouthLarge = document.getElementById('mouthLargeBG');
  const head = document.getElementById('head');
  const headSway = document.getElementById('headSway');

  const eyeQuickL = gsap.quickTo(eyeL, 'x', { duration: 0.25, ease: 'power2.out' });
  const eyeQuickR = gsap.quickTo(eyeR, 'x', { duration: 0.25, ease: 'power2.out' });

  // The head is rigged in two layers, like a real character rig:
  //  - #headSway (outer): a slow, continuous idle drift that runs on its
  //    own timeline, independent of the cursor, so the character never
  //    looks frozen even when you're not interacting with it.
  //  - #head (inner): fast, reactive tilt driven by the cursor/typing.
  // Layering them this way means the two motions never fight over the
  // same property — each owns its own transform.
  gsap.set(head, { transformOrigin: '100px 90px' });
  gsap.set(headSway, { transformOrigin: '100px 100px' });

  const headTiltX = gsap.quickTo(head, 'rotation', { duration: 0.7, ease: 'power4.out' });
  const headTiltY = gsap.quickTo(head, 'y', { duration: 0.7, ease: 'power4.out' });

  gsap.to(headSway, {
    rotation: 1.4,
    duration: 3.4,
    ease: 'sine.inOut',
    yoyo: true,
    repeat: -1
  });

  // Focus glow lines under inputs
  gsap.set([emailLine, passLine], { scaleX: 0 });
  const showLine = (line) => gsap.to(line, { scaleX: 1, duration: 0.3, ease: 'power2.out' });
  const hideLine = (line) => gsap.to(line, { scaleX: 0, duration: 0.25, ease: 'power2.in' });

  emailInput.addEventListener('focus', () => { emailFocused = true; showLine(emailLine); });
  emailInput.addEventListener('blur', () => {
    emailFocused = false;
    hideLine(emailLine);
    gsap.to(head, { rotation: 0, y: 0, duration: 0.6, ease: 'elastic.out(1, 0.6)', overwrite: 'auto' });
  });
  passwordInput.addEventListener('focus', () => showLine(passLine));
  passwordInput.addEventListener('blur', () => hideLine(passLine));

  // Idle cursor-follow for the eyes (paused while typing the email or
  // while the password field is focused, so it never fights those states)
  let emailFocused = false;
  document.addEventListener('mousemove', (e) => {
    if (emailFocused || document.activeElement === passwordInput) return;
    const rect = eyeL.closest('svg').getBoundingClientRect();
    const cx = rect.left + rect.width / 2;
    const cy = rect.top + rect.height / 2;
    const tx = Math.max(-1, Math.min(1, (e.clientX - cx) / 260));
    const ty = Math.max(-1, Math.min(1, (e.clientY - cy) / 260));
    eyeQuickL(tx * 5);
    eyeQuickR(tx * 5);
    // The head follows the same cursor but more subtly and with more
    // rounding, so it reads as a slower, heavier secondary motion behind
    // the quick eye dart — the classic overlapping-action animation trick.
    headTiltX(tx * 6);
    headTiltY(ty * 3);
  });

  // Eyes glance across as you type the email, head tilts curiously along with it
  emailInput.addEventListener('input', () => {
    const t = Math.max(-1, Math.min(1, (emailInput.value.length / 24) * 2 - 1));
    const dx = t * 6;
    eyeQuickL(dx);
    eyeQuickR(dx);
    headTiltX(dx * 0.8);
  });

  let currentMouth = mouthSmall;
  function crossfadeMouth(next) {
    if (next === currentMouth) return;
    gsap.to(currentMouth, { opacity: 0, duration: 0.2, ease: 'power1.out' });
    gsap.to(next, { opacity: 1, duration: 0.25, ease: 'power1.out' });
    currentMouth = next;
  }
  function updateMouth() {
    const len = passwordInput.value.length;
    if (len === 0) crossfadeMouth(mouthSmall);
    else if (len < 6) crossfadeMouth(mouthMedium);
    else crossfadeMouth(mouthLarge);
  }
  gsap.set(mouthSmall, { opacity: 1 });

  gsap.set(armL, { y: 95, rotation: -6, transformOrigin: '50% 100%' });
  gsap.set(armR, { y: 95, rotation: 6, transformOrigin: '50% 100%' });

  let bothHandsTl;

  // The arms travel along real curved paths (MotionPathPlugin) instead of
  // faking an arc out of separate x/y/rotation tweens — the paw genuinely
  // sweeps up and inward on a bezier curve, same technique used for
  // realistic character-rig limb motion.
  const armLUpPath  = [{ x: 0, y: 95 }, { x: 14, y: 46 }, { x: 0, y: 0 }];
  const armRUpPath   = [{ x: 0, y: 95 }, { x: -14, y: 46 }, { x: 0, y: 0 }];
  const armLDownPath = [{ x: 0, y: 0 }, { x: 18, y: 40 }, { x: 0, y: 95 }];
  const armRDownPath = [{ x: 0, y: 0 }, { x: -18, y: 40 }, { x: 0, y: 95 }];

  function coverEyes() {
    bothHandsTl = gsap.timeline({ defaults: { overwrite: 'auto' } });
    bothHandsTl
      // 1. Anticipation — a tiny pull-back before the real motion, like a
      //    real arm loading up energy before it moves.
      .to(armL, { y: '+=10', rotation: -16, duration: 0.08, ease: 'power1.out' }, 0)
      .to(armR, { y: '+=10', rotation: 16, duration: 0.08, ease: 'power1.out' }, 0.03)
      // 2. Real curved swing along the motion path, autoRotate lets the
      //    paw's own angle track the tangent of the curve as it travels.
      .to(armL, { motionPath: { path: armLUpPath, autoRotate: false }, rotation: 0, duration: 0.4, ease: 'handSwing' }, 0.08)
      .to(armR, { motionPath: { path: armRUpPath, autoRotate: false }, rotation: 0, duration: 0.4, ease: 'handSwing' }, 0.12)
      // 3. Follow-through — fingers/paw settle with a soft double-wobble.
      .to(armL, { skewX: 3, duration: 0.09, ease: 'sine.inOut', yoyo: true, repeat: 3 }, 0.5)
      .to(armR, { skewX: -3, duration: 0.09, ease: 'sine.inOut', yoyo: true, repeat: 3 }, 0.54)
      // 4. The head tucks in bashfully once the eyes are hidden.
      .to(head, { rotation: 3, y: 4, duration: 0.4, ease: 'power3.out', overwrite: 'auto' }, 0.12);
  }

  function uncoverEyes() {
    bothHandsTl = gsap.timeline({ defaults: { overwrite: 'auto' } });
    bothHandsTl
      // 1. A shy little peek outward before pulling away.
      .to(armL, { rotation: -10, skewX: 0, duration: 0.12, ease: 'power1.inOut' }, 0)
      .to(armR, { rotation: 10, skewX: 0, duration: 0.12, ease: 'power1.inOut' }, 0.02)
      // 2. Curved drop away, left hand leading slightly.
      .to(armL, { motionPath: { path: armLDownPath, autoRotate: false }, rotation: -6, duration: 0.42, ease: 'handDrop' }, 0.12)
      .to(armR, { motionPath: { path: armRDownPath, autoRotate: false }, rotation: 6, duration: 0.42, ease: 'handDrop' }, 0.16)
      // 3. Head lifts back up out of its bashful tuck.
      .to(head, { rotation: 0, y: 0, duration: 0.55, ease: 'elastic.out(1, 0.65)', overwrite: 'auto' }, 0.14);
  }

  // ── Peek game: both hands cover on focus, the right hand lifts to
  //    peek once the password is 5-7 characters, then both hands clamp
  //    back down once it reaches 8+. This uses its own timeline (armRTl)
  //    that only ever touches armR — it never kills bothHandsTl, so a fast
  //    typist can't interrupt the initial cover-eyes animation mid-flight
  //    and leave the left arm or head frozen partway through a move. Every
  //    individual tween below carries its own overwrite:'auto', so GSAP
  //    still cleanly resolves conflicts on armR specifically without
  //    touching anything else. ──
  let armRTl;
  let handState = 'open'; // 'open' | 'closed' | 'peek'

  function peekOneHand() {
    armRTl = gsap.timeline({ defaults: { overwrite: 'auto' } });
    armRTl
      .to(armR, { rotation: 12, duration: 0.1, ease: 'power1.inOut' }, 0)
      .to(armR, { y: 95, rotation: 6, duration: 0.3, ease: 'power2.in' }, 0.1);
  }

  function closeBothHands() {
    armRTl = gsap.timeline({ defaults: { overwrite: 'auto' } });
    armRTl
      .to(armR, { y: 108, rotation: 16, duration: 0.08, ease: 'power1.out' }, 0)
      .to(armR, { y: -6, rotation: 3, duration: 0.22, ease: 'power3.out' }, 0.08)
      .to(armR, { y: 0, rotation: 0, duration: 0.18, ease: 'power2.inOut' }, 0.3)
      .to(armR, { skewX: -3, duration: 0.08, ease: 'sine.inOut', yoyo: true, repeat: 3 }, 0.44);
  }

  function updatePeekState() {
    const len = passwordInput.value.length;
    const desired = (len >= 5 && len <= 7) ? 'peek' : 'closed';
    if (desired === handState) return;
    if (desired === 'peek') peekOneHand();
    else closeBothHands();
    handState = desired;
  }

  passwordInput.addEventListener('focus', () => { handState = 'closed'; });
  passwordInput.addEventListener('blur', () => { handState = 'open'; });
  passwordInput.addEventListener('input', updatePeekState);

  // ── Idle breathing on the body while nothing is focused ──
  gsap.to('.body', { y: -2, duration: 2.2, ease: 'sine.inOut', yoyo: true, repeat: -1, transformOrigin: '50% 100%' });

  passwordInput.addEventListener('focus', coverEyes);
  passwordInput.addEventListener('blur', uncoverEyes);
  passwordInput.addEventListener('input', updateMouth);

  function setLoading(isLoading, label) {
    loginBtn.disabled = isLoading;
    spinner.classList.toggle('active', isLoading);
    btnText.textContent = label || (isLoading ? 'Logging in…' : 'Login');
    if (!isLoading) gsap.fromTo(loginBtn, { scale: 0.97 }, { scale: 1, duration: 0.25, ease: 'back.out(2)' });
  }

  function shakeForm() {
    gsap.fromTo('form',
      { x: 0 },
      { x: 10, duration: 0.06, repeat: 5, yoyo: true, ease: 'power1.inOut',
        onComplete: () => gsap.set('form', { x: 0 }) }
    );
  }

  function successPulse() {
    return gsap.timeline()
      .to(head, { rotation: -7, duration: 0.16, ease: 'power2.out', overwrite: 'auto' })
      .to(head, { rotation: 5, duration: 0.18, ease: 'power1.inOut' })
      .to(head, { rotation: 0, duration: 0.35, ease: 'elastic.out(1, 0.7)' })
      .to('form', { scale: 1.02, duration: 0.15, ease: 'power2.out' }, 0)
      .to('form', { opacity: 0, y: -16, duration: 0.35, ease: 'power2.in' }, '+=0.1');
  }

  const withTimeout = (promise, ms, timeoutErr) => {
    let timer;
    const timeout = new Promise((_, reject) => {
      timer = setTimeout(() => reject(timeoutErr), ms);
    });
    return Promise.race([promise, timeout]).finally(() => clearTimeout(timer));
  };
  const TIMEOUT_ERR = Object.assign(new Error('timeout'), { code: 'app/timeout' });

  loginForm.addEventListener('submit', async (e) => {
    e.preventDefault();

    const rawEmail = emailInput.value.trim();
    const pass = passwordInput.value;

    if (!rawEmail || !pass) {
      shakeForm();
      alert('Please enter your email and password.');
      return;
    }
    if (pass.length < 6) {
      shakeForm();
      alert('Password must be at least 6 characters.');
      return;
    }

    setLoading(true, 'Checking…');

    try {
      // Persistence: sessions stay signed in across browser restarts.
      await withTimeout(setPersistence(auth, browserLocalPersistence), 15000, TIMEOUT_ERR);

      const userCred = await withTimeout(
        signInWithEmailAndPassword(auth, rawEmail, pass),
        15000, TIMEOUT_ERR
      );

      setDoc(doc(db, 'veeraUsers', userCred.user.uid), { lastLogin: serverTimestamp() }, { merge: true })
        .catch(err => console.warn('lastLogin write failed (non-fatal):', err));

      setLoading(false, 'Success');
      btnText.textContent = 'Success ✓';
      await successPulse();
      window.location.href = 'dashboard.html';
    } catch (err) {
      console.error('Login failed:', err);
      setLoading(false);
      shakeForm();
      alert(friendlyLoginError(err));
    }
  });

  function friendlyLoginError(err) {
    const code = err && err.code;
    switch (code) {
      case 'app/timeout':
        return 'This is taking too long. Please check your internet connection and try again.';
      case 'auth/user-not-found':
        return 'This Veera Cloud account does not exist. Please check your email or sign up.';
      case 'auth/wrong-password':
      case 'auth/invalid-credential':
      case 'auth/invalid-login-credentials':
        return 'Wrong username or password. Please try again.';
      case 'auth/invalid-email':
        return 'That email address doesn\'t look right. Please check and try again.';
      case 'auth/user-disabled':
        return 'This account has been disabled. Please contact Veera Cloud support.';
      case 'auth/too-many-requests':
        return 'Too many attempts. Please wait a moment and try again.';
      case 'auth/network-request-failed':
        return 'Network error. Please check your internet connection and try again.';
      case 'auth/operation-not-allowed':
        return 'Email/password sign-in isn\'t enabled for this app yet. Please contact Veera Cloud support.';
      case 'auth/unauthorized-domain':
        return 'This website isn\'t authorized for login yet. Please contact Veera Cloud support.';
      case 'permission-denied':
      case 'unavailable':
      case 'not-found':
        return 'Login succeeded, but we couldn\'t reach Veera Cloud\'s database. Please try again shortly.';
      default:
        return 'Login failed. Please try again.';
    }
  }
</script>
