<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>411 — Length Required</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; }
  body {
    font-family:'SFMono-Regular', ui-monospace, 'Courier New', monospace;
    background:#0a0e0a; color:#33ff66; height:100vh; overflow:hidden;
    display:flex; align-items:center; justify-content:center; padding:20px;
  }
  /* CRT scanlines + flicker */
  body::before {
    content:''; position:fixed; inset:0; pointer-events:none; z-index:5;
    background:repeating-linear-gradient(0deg, rgba(0,0,0,0) 0, rgba(0,0,0,0) 2px, rgba(0,0,0,.28) 3px);
    animation:flick .12s steps(2) infinite;
  }
  @keyframes flick { 0%{opacity:.9} 50%{opacity:1} }
  .term {
    width:min(760px,100%); border:1px solid #1c3a1c; border-radius:10px;
    background:rgba(10,25,10,.7); box-shadow:0 0 60px rgba(51,255,102,.15), inset 0 0 40px rgba(51,255,102,.05);
    padding:26px 28px; position:relative; z-index:1;
  }
  .bar { display:flex; gap:7px; margin-bottom:20px; }
  .bar i { width:12px; height:12px; border-radius:50%; display:block; }
  .bar i:nth-child(1){background:#ff5f56} .bar i:nth-child(2){background:#ffbd2e} .bar i:nth-child(3){background:#27c93f}
  .line { font-size:14px; line-height:1.9; text-shadow:0 0 8px rgba(51,255,102,.6); white-space:pre-wrap; }
  .code { font-size:clamp(48px,11vw,96px); font-weight:bold; letter-spacing:4px; margin:14px 0 6px; text-shadow:0 0 18px rgba(51,255,102,.8); }
  .cursor { display:inline-block; width:11px; height:20px; background:#33ff66; margin-left:3px; animation:blink 1s steps(1) infinite; vertical-align:middle; }
  @keyframes blink { 50%{opacity:0} }
  a.btn {
    display:inline-block; margin-top:22px; text-decoration:none; color:#0a0e0a;
    background:#33ff66; padding:11px 24px; border-radius:6px; font-weight:bold; font-size:13px;
    box-shadow:0 0 18px rgba(51,255,102,.5); transition:transform .2s, box-shadow .2s;
  }
  a.btn:hover { transform:translateY(-2px); box-shadow:0 0 30px rgba(51,255,102,.8); }
</style>
</head>
<body>
<div class="term">
  <div class="bar"><i></i><i></i><i></i></div>
  <div class="code">411</div>
  <div class="line" id="out"></div>
  <a class="btn" href="../dashboard.html">$ cd ../dashboard</a>
</div>
<script>
  const lines = [
    "> ERROR 411: Length Required",
    "> the server refused your request —",
    "> it needs a Content-Length header it never got.",
    "> nothing was measured, so nothing was served.",
    "> _"
  ];
  const out = document.getElementById('out');
  let li=0, ci=0, buf="";
  function type(){
    if(li>=lines.length){ out.innerHTML = buf.slice(0,-2)+'<span class="cursor"></span>'; return; }
    if(ci<lines[li].length){ buf+=lines[li][ci++]; out.textContent=buf; setTimeout(type,26); }
    else { buf+="\n"; li++; ci=0; setTimeout(type,380); }
  }
  type();
</script>
</body>
</html>
