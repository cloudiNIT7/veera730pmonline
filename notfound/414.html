<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>414 — URI Too Long</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Sora:wght@400;600;800&display=swap');
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; }
  body {
    font-family:'Sora', sans-serif;
    background:#07101c; color:#d4f1ff; height:100vh; overflow:hidden;
    display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center;
    position:relative;
  }
  /* scrolling endless URL ribbon in the background */
  .ribbon {
    position:absolute; inset:0; overflow:hidden; opacity:.14; pointer-events:none;
  }
  .ribbon div {
    white-space:nowrap; font-family:ui-monospace, monospace; font-size:22px; color:#2ec5ff;
    animation:slide 24s linear infinite;
  }
  .ribbon div:nth-child(even){ animation-duration:32s; animation-direction:reverse; }
  @keyframes slide { from{transform:translateX(0)} to{transform:translateX(-50%)} }
  .content { position:relative; z-index:2; }
  h1 { font-size:clamp(70px,16vw,150px); font-weight:800; letter-spacing:-4px; line-height:1;
       background:linear-gradient(90deg,#2ec5ff,#7a54dc); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; }
  p.big { font-size:22px; font-weight:600; margin:6px 0 8px; }
  p.small { color:#89b4cc; max-width:460px; margin:0 22px 20px; line-height:1.6; font-size:14px; }
  .url-chip {
    display:inline-block; max-width:min(560px,90vw); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
    font-family:ui-monospace, monospace; font-size:12px; color:#2ec5ff; background:rgba(46,197,255,.08);
    border:1px solid rgba(46,197,255,.25); padding:8px 14px; border-radius:8px; margin-bottom:24px;
  }
  a.btn { text-decoration:none; color:#07101c; background:#2ec5ff; padding:13px 28px; border-radius:99px;
          font-weight:800; font-size:14px; box-shadow:0 10px 30px rgba(46,197,255,.4); transition:transform .25s; }
  a.btn:hover { transform:translateY(-3px); }
</style>
</head>
<body>
<div class="ribbon" id="ribbon"></div>
<div class="content">
  <h1>414</h1>
  <p class="big">URI Too Long</p>
  <p class="small">That web address stretched on forever — longer than the server will ever read. Here's a much shorter one:</p>
  <div class="url-chip" id="chip">/</div>
  <br>
  <a class="btn" href="../dashboard.html">← Back to Dashboard</a>
</div>
<script>
  const seg = "veera/exam/page/very/long/path/query?id=";
  let long = "/"; for(let i=0;i<14;i++) long += seg + Math.random().toString(36).slice(2)+"&";
  document.getElementById('chip').textContent = long.slice(0,120)+"…";
  const rb = document.getElementById('ribbon');
  const row = long+long;
  for(let i=0;i<10;i++){ const d=document.createElement('div'); d.textContent=row; d.style.top=(i*10)+'%'; d.style.position='absolute'; rb.appendChild(d); }
</script>
</body>
</html>
