<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>404 – Lost?</title>
  <style>
    /* ── Reset ── */
    *, *::after, *::before {
      box-sizing: border-box;
    }

    html {
      background: #000;
      font-family: Arial, "Helvetica Neue", Helvetica, sans-serif;
    }

    /* ────────────────────────────────
       HEAD  →  the alien's cranium wrapper
    ──────────────────────────────── */
    head {
      display: block;
      position: relative;
      width: 200px;
      margin: 10% auto 0;
      animation: shvr .2s infinite;
    }

    /* eyes */
    head::after {
      content: '';
      width: 20px;
      height: 20px;
      background: #000;
      position: absolute;
      top: 30px;
      left: 25px;
      border-radius: 50%;
      /* second eye via box-shadow */
      box-shadow: 125px 0 0 #000;
      animation: eye 2.5s infinite;
    }

    /* ────────────────────────────────
       META  →  the two ear / cheek blobs
    ──────────────────────────────── */
    meta {
      position: relative;
      display: inline-block;
      background: #fff;
      width: 75px;
      height: 80px;
      border-radius: 50% 50% 50% 50% / 45px 45px 45% 45%;
      transform: rotate(45deg);
    }

    /* chin curve */
    meta::after {
      content: '';
      position: absolute;
      border-bottom: 2px solid #fff;
      width: 70px;
      height: 50px;
      left: 0;
      bottom: -10px;
      border-radius: 50%;
    }

    meta::before {
      bottom: auto;
      top: -100px;
      transform: rotate(45deg);
      left: 0;
    }

    /* right ear blob */
    meta:nth-of-type(2) {
      float: right;
      transform: rotate(-45deg);
    }
    meta:nth-of-type(2)::after {
      left: 5px;
    }

    /* charset meta – hidden */
    meta:nth-of-type(3) {
      display: none;
    }

    /* ────────────────────────────────
       BODY  →  404 text block
    ──────────────────────────────── */
    body {
      margin-top: 100px;
      text-align: center;
      color: #fff;
    }

    body::before {
      content: '404';
      font-size: 80px;
      font-weight: 800;
      display: block;
      margin-bottom: 10px;
    }

    body::after {
      content: 'Got lost? How.....?  why.....?  Ahhhh....';
      color: #1EA7AB;
      width: 120px;
      font-size: 30px;
      overflow: hidden;
      display: inline-block;
      white-space: nowrap;
      animation: text-show 2s infinite steps(3);
    }

    /* ────────────────────────────────
       KEYFRAMES
    ──────────────────────────────── */

    /* eye darting around */
    @keyframes eye {
      0%,  30%, 55%,  90%, 100% { transform: translate(0, 0);      }
      10%, 25%                  { transform: translate(0, 20px);    }
      65%                       { transform: translate(-20px, 0);   }
      80%                       { transform: translate(20px, 0);    }
    }

    /* head micro-shiver */
    @keyframes shvr {
      0%   { transform: translateX(1px);  }
      50%  { transform: translateX(0);    }
      100% { transform: translateX(-1px); }
    }

    /* typewriter-style text reveal */
    @keyframes text-show {
      to { text-indent: -373px; }
    }
  </style>
</head>
<body>
<script src="../ai-agent-widget.js"></script>
</body>
</html>
