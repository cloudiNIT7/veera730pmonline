<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>415 — Unsupported Media Type</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&display=swap');
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; }
  body {
    font-family:'Chakra Petch', sans-serif;
    background:#0d0612; color:#ffd6f2; height:100vh; overflow:hidden;
    display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center;
  }
  canvas#noise { position:fixed; inset:0; z-index:0; opacity:.10; }
  .content { position:relative; z-index:2; }
  .file {
    width:120px; height:150px; margin:0 auto 26px; position:relative;
    background:linear-gradient(180deg,#2a1030,#1a0a22); border:2px solid #ff3ec9; border-radius:10px;
    box-shadow:0 0 40px rgba(255,62,201,.4); animation:glitchbox 3s infinite;
  }
  .file::before { content:''; position:absolute; top:0; right:0; width:34px; height:34px;
    background:#0d0612; border-left:2px solid #ff3ec9; border-bottom:2px solid #ff3ec9;
    border-radius:0 8px 0 8px; }
  .file .q { position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-size:60px; font-weight:700; color:#ff3ec9; text-shadow:0 0 20px #ff3ec9; }
  @keyframes glitchbox {
    0%,100%{ transform:translate(0,0); } 92%{ transform:translate(0,0); }
    94%{ transform:translate(-4px,2px) skewX(6deg); } 96%{ transform:translate(3px,-2px) skewX(-6deg); }
    98%{ transform:translate(-2px,1px); }
  }
  h1 {
    font-size:clamp(70px,15vw,140px); font-weight:700; letter-spacing:-2px; line-height:1;
    color:#ff3ec9; position:relative;
  }
  h1::before, h1::after {
    content:'415'; position:absolute; left:0; top:0; width:100%;
  }
  h1::before { color:#00e0ff; animation:g1 2.5s infinite; }
  h1::after  { color:#ffe600; animation:g2 2.5s infinite; }
  @keyframes g1 { 0%,90%,100%{clip-path:inset(0 0 100% 0); transform:translate(0)} 92%{clip-path:inset(10% 0 55% 0); transform:translate(-5px)} 96%{clip-path:inset(60% 0 10% 0); transform:translate(4px)} }
  @keyframes g2 { 0%,90%,100%{clip-path:inset(100% 0 0 0); transform:translate(0)} 93%{clip-path:inset(40% 0 40% 0); transform:translate(5px)} 97%{clip-path:inset(15% 0 60% 0); transform:translate(-4px)} }
  p.big { font-size:22px; font-weight:600; margin:6px 0 8px; }
  p.small { color:#c98fbb; max-width:440px; margin:0 22px 26px; line-height:1.6; font-size:14px; }
  a.btn { text-decoration:none; color:#0d0612; background:#ff3ec9; padding:13px 28px; border-radius:99px;
          font-weight:700; font-size:14px; box-shadow:0 10px 30px rgba(255,62,201,.45); transition:transform .25s; }
  a.btn:hover { transform:translateY(-3px); }
</style>
</head>
<body>
<canvas id="noise"></canvas>
<div class="content">
  <div class="file"><div class="q">?</div></div>
  <h1>415</h1>
  <p class="big">Unsupported Media Type</p>
  <p class="small">The server took one look at that file format and had no idea what to do with it. Let's head back to familiar territory.</p>
  <a class="btn" href="../dashboard.html">← Back to Dashboard</a>
</div>
<script>
  const c = document.getElementById('noise'), x = c.getContext('2d');
  function fit(){ c.width=innerWidth; c.height=innerHeight; }
  fit(); addEventListener('resize', fit);
  (function draw(){
    const img = x.createImageData(c.width, c.height);
    const b = img.data;
    for(let i=0;i<b.length;i+=4){ const v=Math.random()*255; b[i]=v; b[i+1]=v; b[i+2]=v; b[i+3]=255; }
    x.putImageData(img,0,0);
    setTimeout(()=>requestAnimationFrame(draw), 60);
  })();
</script>
</body>
</html>
