<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Cloud Init — AWS Notes</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --ink: #0a0a0c;
      --ink-2: #17171c;

      --bg: #ffffff;
      --bg-soft: #f4f4f7;
      --bg-deep: #e8e8ee;

      --cloud-a: #ece9f6;
      --cloud-b: #f1f1f4;
      --cloud-c: #ffffff;

      --violet: #6e56cf;
      --violet-deep: #4c3aa0;
      --violet-light: #b9a9f5;
      --violet-dim: rgba(110, 86, 207, 0.32);

      --panel: rgba(255, 255, 255, 0.6);
      --panel-strong: rgba(255, 255, 255, 0.85);
      --panel-border: rgba(20, 20, 26, 0.09);

      --panel-dark: rgba(255, 255, 255, 0.07);
      --panel-dark-border: rgba(255, 255, 255, 0.16);

      --text: #17171c;
      --text-dim: #5c5c67;
      --text-on-dark: #f5f3fb;
      --text-on-dark-dim: #b3aec4;

      --mono: 'JetBrains Mono', 'Courier New', monospace;
      --display: 'Sora', 'Segoe UI', sans-serif;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 100%;
      height: 100vh;
      overflow: hidden;
      font-family: var(--display);
      background: var(--bg);
      color: var(--text);
    }

    /* =========================
       AMBIENT CLOUD FIELD
    ========================== */

    .cloud-field {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      background: radial-gradient(120% 90% at 50% -10%, #ffffff 0%, var(--bg-soft) 55%, var(--bg-deep) 100%);
    }

    .cloud-layer {
      position: absolute;
      inset: -10% -20%;
      will-change: transform;
    }

    .cloud-layer .blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(60px);
    }

    .layer-back { animation: driftSlow 70s ease-in-out infinite alternate; }
    .layer-mid  { animation: driftSlow 46s ease-in-out infinite alternate; }
    .layer-front{ animation: driftSlow 30s ease-in-out infinite alternate; }

    .layer-back .blob   { background: var(--cloud-a); opacity: 0.65; }
    .layer-mid .blob     { background: var(--cloud-b); opacity: 0.7; }
    .layer-front .blob  { background: var(--cloud-c); opacity: 0.8; }

    .b1 { width: 42vw; height: 42vw; top: 4%;  left: 6%; }
    .b2 { width: 30vw; height: 30vw; top: 40%; left: 62%; }
    .b3 { width: 26vw; height: 26vw; top: 62%; left: 20%; }
    .b4 { width: 34vw; height: 34vw; top: 12%; left: 58%; }
    .b5 { width: 22vw; height: 22vw; top: 70%; left: 70%; }
    .b6 { width: 20vw; height: 20vw; top: 20%; left: 30%; }

    @keyframes driftSlow {
      from { transform: translate3d(-4%, 0, 0); }
      to   { transform: translate3d(4%, 2%, 0); }
    }

    /* =========================
       LOADING SCREEN
    ========================== */

    .loading-screen {
      position: fixed;
      inset: 0;
      z-index: 999999;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(120% 90% at 50% -10%, #241a3d 0%, var(--ink) 55%, #050506 100%);
      transition: opacity 0.7s ease, visibility 0.7s ease;
    }

    .loading-screen.hide {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .loading-box {
      position: relative;
      z-index: 2;
      text-align: center;
      color: var(--text-on-dark);
      padding: 40px 34px;
      width: 100%;
      max-width: 380px;
      background: var(--panel-dark);
      border: 1px solid var(--panel-dark-border);
      border-radius: 22px;
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
      box-shadow: 0 30px 70px rgba(0, 0, 0, 0.5);
    }

    .loading-logo {
      width: 76px;
      height: 76px;
      margin: 0 auto 20px;
      position: relative;
      border-radius: 18px;
      overflow: hidden;
      animation: logoFloat 2.2s ease-in-out infinite;
      box-shadow: 0 0 0 1px var(--panel-dark-border), 0 0 34px var(--violet-dim);
    }

    .loading-logo img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      opacity: 0;
      transition: opacity 0.4s ease;
      position: relative;
      z-index: 2;
      background: var(--ink-2);
    }

    .loading-logo img.loaded {
      opacity: 1;
    }

    .logo-skeleton {
      position: absolute;
      inset: 0;
      z-index: 1;
      border-radius: 18px;
      background: var(--ink-2);
    }

    .loading-logo img.loaded + .logo-skeleton {
      display: none;
    }

    .loading-title {
      font-size: 22px;
      font-weight: 800;
      margin-bottom: 6px;
      color: var(--text-on-dark);
      letter-spacing: 0.2px;
    }

    .loading-subtitle {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--violet-light);
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 26px;
      min-height: 14px;
    }

    .progress-wrapper {
      width: 100%;
      height: 6px;
      background: rgba(255, 255, 255, 0.12);
      border-radius: 999px;
      overflow: hidden;
      margin-bottom: 12px;
      border: 1px solid var(--panel-dark-border);
    }

    .progress-line {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, var(--violet-light), var(--violet-deep));
      border-radius: 999px;
      transition: width 0.3s ease;
      box-shadow: 0 0 14px var(--violet-dim);
    }

    .loading-percent {
      font-family: var(--mono);
      font-size: 13px;
      font-weight: 600;
      color: var(--text-on-dark);
      margin-bottom: 10px;
      letter-spacing: 0.5px;
    }

    .loading-message {
      font-size: 12px;
      color: var(--text-on-dark-dim);
    }

    @keyframes logoFloat {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-7px) scale(1.04); }
    }

    /* =========================
       MAIN PAGE
    ========================== */

    .app {
      position: relative;
      z-index: 1;
      width: 100%;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .header {
      height: 66px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(10, 10, 12, 0.92);
      position: relative;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.18);
    }

    .header::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: -1px;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--violet), transparent);
      opacity: 0.8;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 13px;
    }

    .logo {
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background: var(--panel-dark);
      position: relative;
      border-radius: 10px;
      border: 1px solid var(--panel-dark-border);
      box-shadow: 0 0 22px var(--violet-dim);
    }

    .logo img {
      width: 40px;
      height: 40px;
      object-fit: contain;
      display: block;
      opacity: 0;
      transition: opacity 0.4s ease;
      position: relative;
      z-index: 2;
    }

    .logo img.loaded {
      opacity: 1;
    }

    .logo .logo-skeleton {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.1);
    }

    .logo img.loaded + .logo-skeleton {
      display: none;
    }

    .title h1 {
      font-size: 20px;
      font-weight: 800;
      color: var(--text-on-dark);
      line-height: 1.15;
      letter-spacing: 0.2px;
    }

    .title p {
      margin-top: 2px;
      font-family: var(--mono);
      font-size: 10px;
      color: var(--text-on-dark-dim);
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .viewer-area {
      flex: 1;
      overflow: hidden;
      padding: 18px 22px 22px;
      display: flex;
    }

    .viewer-shell {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: 18px;
      overflow: hidden;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      box-shadow: 0 24px 60px rgba(30, 25, 45, 0.14);
    }

    .viewer-toolbar {
      height: 42px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      background: rgba(20, 20, 26, 0.035);
      border-bottom: 1px solid var(--panel-border);
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.4px;
    }

    .file-chip {
      color: var(--text-dim);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .status-chip {
      display: flex;
      align-items: center;
      gap: 7px;
      color: var(--text-dim);
      white-space: nowrap;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--violet);
      box-shadow: 0 0 0 0 var(--violet-dim);
      animation: pulseDot 2s ease-in-out infinite;
    }

    @keyframes pulseDot {
      0%   { box-shadow: 0 0 0 0 rgba(110, 86, 207, 0.55); }
      70%  { box-shadow: 0 0 0 8px rgba(110, 86, 207, 0); }
      100% { box-shadow: 0 0 0 0 rgba(110, 86, 207, 0); }
    }

    .viewer-frame {
      position: relative;
      flex: 1;
      background: #ffffff;
    }

    .corner {
      position: absolute;
      width: 18px;
      height: 18px;
      pointer-events: none;
      opacity: 0.9;
      z-index: 3;
      filter: drop-shadow(0 0 5px var(--violet-dim));
    }

    .corner.tl { top: 8px;    left: 8px;  border-top: 2px solid var(--violet-deep);    border-left: 2px solid var(--violet-deep); }
    .corner.tr { top: 8px;    right: 8px; border-top: 2px solid var(--violet-deep);    border-right: 2px solid var(--violet-deep); }
    .corner.bl { bottom: 8px; left: 8px;  border-bottom: 2px solid var(--violet-deep); border-left: 2px solid var(--violet-deep); }
    .corner.br { bottom: 8px; right: 8px; border-bottom: 2px solid var(--violet-deep); border-right: 2px solid var(--violet-deep); }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      background: white;
    }

    .badge {
      position: fixed;
      right: 22px;
      bottom: 20px;
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--panel-strong);
      color: var(--text);
      padding: 9px 15px;
      border-radius: 999px;
      border: 1px solid var(--panel-border);
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 1px;
      text-transform: uppercase;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      box-shadow: 0 12px 30px rgba(30, 25, 45, 0.18);
      z-index: 100;
    }

    .badge .status-dot {
      width: 6px;
      height: 6px;
    }

    @media (prefers-reduced-motion: reduce) {
      .layer-back, .layer-mid, .layer-front,
      .loading-logo, .status-dot {
        animation: none !important;
      }
    }

    @media (max-width: 768px) {
      .header {
        height: 60px;
      }

      .logo, .logo img, .logo .logo-skeleton {
        width: 34px;
        height: 34px;
      }

      .title h1 {
        font-size: 17px;
      }

      .title p {
        font-size: 8px;
        letter-spacing: 1.5px;
      }

      .viewer-area {
        padding: 10px 10px 14px;
      }

      .viewer-toolbar {
        font-size: 9.5px;
        padding: 0 10px;
      }

      .file-chip {
        max-width: 46vw;
      }

      .badge {
        right: 12px;
        bottom: 12px;
        font-size: 9px;
        padding: 7px 11px;
      }

      .loading-box {
        padding: 30px 22px;
      }

      .loading-title {
        font-size: 19px;
      }

      .loading-logo {
        width: 64px;
        height: 64px;
      }
    }
  </style>
</head>

<body>

  <div class="cloud-field" aria-hidden="true">
    <div class="cloud-layer layer-back">
      <div class="blob b1"></div>
      <div class="blob b2"></div>
    </div>
    <div class="cloud-layer layer-mid">
      <div class="blob b3"></div>
      <div class="blob b4"></div>
    </div>
    <div class="cloud-layer layer-front">
      <div class="blob b5"></div>
      <div class="blob b6"></div>
    </div>
  </div>

  <!-- LOADING SCREEN -->
  <div class="loading-screen" id="loadingScreen">
    <div class="loading-box">

      <div class="loading-logo">
        <img
          class="brand-logo"
          src="https://i.ibb.co/bMgt1Tgq/cloudinit.png"
          alt="Cloud Init Logo"
          onload="this.classList.add('loaded')"
        />
        <div class="logo-skeleton"></div>
      </div>

      <div class="loading-title">Cloud Init AWS Notes</div>
      <div class="loading-subtitle" id="loadingSubtitle">Establishing secure session</div>

      <div class="progress-wrapper">
        <div class="progress-line" id="progressLine"></div>
      </div>

      <div class="loading-percent" id="loadingPercent">0%</div>
      <div class="loading-message">Please wait, your notes are opening…</div>

    </div>
  </div>

  <!-- MAIN APP -->
  <div class="app">

    <header class="header">
      <div class="brand">

        <div class="logo">
          <img
            class="brand-logo"
            src="https://i.ibb.co/bMgt1Tgq/cloudinit.png"
            alt="Cloud Init Logo"
            onload="this.classList.add('loaded')"
          />
          <div class="logo-skeleton"></div>
        </div>

        <div class="title">
          <h1>Cloud Init</h1>
          <p>Cloud Learning Document</p>
        </div>

      </div>
    </header>

    <main class="viewer-area">
      <div class="viewer-shell">

        <div class="viewer-toolbar">
          <span class="file-chip">aws_final_notes.pdf</span>
          <span class="status-chip"><span class="status-dot"></span>Secure view · Read-only</span>
        </div>

        <div class="viewer-frame">
          <span class="corner tl"></span>
          <span class="corner tr"></span>
          <span class="corner bl"></span>
          <span class="corner br"></span>
          <iframe
            id="pdfFrame">
          </iframe>
        </div>

      </div>
    </main>

  </div>

  <div class="badge"><span class="status-dot"></span>Cloud Init Secure Reader</div>

  <script>
    // Notes URL is served by the Cloudflare Worker route below,
    // so it is not hardcoded in this file.
    const NOTES_URL_ENDPOINT = "https://notesawsbackend.cloudgcp08.workers.dev/";

    const loadingScreen = document.getElementById("loadingScreen");
    const pdfFrame = document.getElementById("pdfFrame");
    const progressLine = document.getElementById("progressLine");
    const loadingPercent = document.getElementById("loadingPercent");
    const loadingSubtitle = document.getElementById("loadingSubtitle");

    // Mark any already-cached logo images as loaded immediately
    document.querySelectorAll("img.brand-logo").forEach(function (img) {
      if (img.complete && img.naturalWidth > 0) {
        img.classList.add("loaded");
      }
    });

    let progress = 0;
    let pdfLoaded = false;

    function updateProgress(value) {
      progress = value;

      if (progress > 100) {
        progress = 100;
      }

      progressLine.style.width = progress + "%";
      loadingPercent.textContent = progress + "%";

      if (!pdfLoaded) {
        if (progress < 30) {
          loadingSubtitle.textContent = "Establishing secure session";
        } else if (progress < 65) {
          loadingSubtitle.textContent = "Decrypting document";
        } else {
          loadingSubtitle.textContent = "Preparing viewer";
        }
      }
    }

    const fakeLoading = setInterval(function () {
      if (!pdfLoaded) {
        if (progress < 90) {
          progress += 3;
          updateProgress(progress);
        }
      }
    }, 180);

    pdfFrame.addEventListener("load", function () {
      pdfLoaded = true;
      loadingSubtitle.textContent = "Rendering notes";

      clearInterval(fakeLoading);

      const finishLoading = setInterval(function () {
        progress += 5;
        updateProgress(progress);

        if (progress >= 100) {
          clearInterval(finishLoading);
          loadingSubtitle.textContent = "Ready";

          setTimeout(function () {
            loadingScreen.classList.add("hide");
          }, 700);
        }
      }, 70);
    });

    pdfFrame.addEventListener("error", function () {
      clearInterval(fakeLoading);
      loadingSubtitle.textContent = "PDF failed to load";
      loadingPercent.textContent = "Error";
    });

    // Fallback: never let the loader hang. If the iframe "load" event
    // never fires (blocked, CORS, 404, slow network), force the viewer
    // open after a timeout so the page is always usable.
    setTimeout(function () {
      if (!pdfLoaded) {
        clearInterval(fakeLoading);
        updateProgress(100);
        loadingSubtitle.textContent = "Ready";
        setTimeout(function () {
          loadingScreen.classList.add("hide");
        }, 500);
      }
    }, 8000);

    // Fetch the notes URL from the Worker, then point the iframe at it.
    // Listeners above are already attached, so no load-event race.
    (async function loadNotesUrl() {
      try {
        const res = await fetch(NOTES_URL_ENDPOINT);
        if (!res.ok) throw new Error("HTTP " + res.status);
        const data = await res.json();
        if (!data.url) throw new Error("No url in response");
        pdfFrame.src = data.url + "#toolbar=0&navpanes=0&scrollbar=1";
      } catch (e) {
        clearInterval(fakeLoading);
        loadingSubtitle.textContent = "Could not load notes URL";
        loadingPercent.textContent = "Error";
      }
    })();

    document.addEventListener("contextmenu", function(event) {
      event.preventDefault();
    });

    document.addEventListener("keydown", function(event) {
      const key = event.key.toLowerCase();

      if (
        event.key === "F12" ||
        (event.ctrlKey && key === "s") ||
        (event.ctrlKey && key === "p") ||
        (event.ctrlKey && key === "u") ||
        (event.ctrlKey && event.shiftKey && key === "i") ||
        (event.ctrlKey && event.shiftKey && key === "j") ||
        (event.ctrlKey && event.shiftKey && key === "c")
      ) {
        event.preventDefault();
      }
    });
  </script>

<script src="ai-agent-widget.js"></script>
</body>
</html>
