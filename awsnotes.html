<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Cloud Init AWS Notes</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 100%;
      height: 100vh;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
      background: #ffffff;
      color: #111827;
    }

    /* =========================
       LOADING SCREEN
    ========================== */

    .loading-screen {
      position: fixed;
      inset: 0;
      background: #111827;
      z-index: 999999;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.6s ease, visibility 0.6s ease;
    }

    .loading-screen.hide {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .loading-box {
      text-align: center;
      color: white;
      padding: 25px;
      width: 100%;
      max-width: 360px;
    }

    .loading-logo {
      width: 90px;
      height: 90px;
      margin: 0 auto 18px;
      position: relative;
      border-radius: 18px;
      overflow: hidden;
      animation: logoFloat 1.8s ease-in-out infinite;
    }

    .loading-logo img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      opacity: 0;
      transition: opacity 0.4s ease;
      position: relative;
      z-index: 2;
    }

    .loading-logo img.loaded {
      opacity: 1;
    }

    .logo-skeleton {
      position: absolute;
      inset: 0;
      z-index: 1;
      border-radius: 18px;
      background: linear-gradient(
        100deg,
        #1f2937 30%,
        #374151 50%,
        #1f2937 70%
      );
      background-size: 200% 100%;
      animation: shimmer 1.3s ease-in-out infinite;
    }

    .loading-logo img.loaded + .logo-skeleton {
      display: none;
    }

    @keyframes shimmer {
      0% {
        background-position: 200% 0;
      }
      100% {
        background-position: -200% 0;
      }
    }

    .loading-title {
      font-size: 25px;
      font-weight: 800;
      margin-bottom: 8px;
      color: #ffffff;
    }

    .loading-subtitle {
      font-size: 13px;
      color: #d1d5db;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin-bottom: 22px;
    }

    .loader-circle {
      width: 54px;
      height: 54px;
      border-radius: 50%;
      border: 4px solid #374151;
      border-top-color: #ffffff;
      margin: 0 auto 24px;
      animation: spin 0.9s linear infinite;
    }

    .progress-wrapper {
      width: 100%;
      height: 7px;
      background: #374151;
      border-radius: 999px;
      overflow: hidden;
      margin-bottom: 12px;
    }

    .progress-line {
      width: 0%;
      height: 100%;
      background: #ffffff;
      border-radius: 999px;
      transition: width 0.3s ease;
    }

    .loading-percent {
      font-size: 14px;
      font-weight: bold;
      color: #ffffff;
      margin-bottom: 8px;
    }

    .loading-message {
      font-size: 12px;
      color: #9ca3af;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes logoFloat {
      0%, 100% {
        transform: translateY(0) scale(1);
        opacity: 0.9;
      }

      50% {
        transform: translateY(-8px) scale(1.06);
        opacity: 1;
      }
    }

    /* =========================
       MAIN PAGE
    ========================== */

    .app {
      width: 100%;
      height: 100vh;
      display: flex;
      flex-direction: column;
      background: #ffffff;
    }

    .header {
      height: 62px;
      background: #111827;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 22px rgba(0, 0, 0, 0.18);
      z-index: 50;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo {
      width: 39px;
      height: 39px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background: transparent;
      position: relative;
      border-radius: 8px;
    }

    .logo img {
      width: 39px;
      height: 39px;
      object-fit: contain;
      display: block;
      opacity: 0;
      transition: opacity 0.4s ease;
      position: relative;
      z-index: 2;
    }

    .logo img.loaded {
      opacity: 1;
    }

    .logo .logo-skeleton {
      width: 39px;
      height: 39px;
      border-radius: 8px;
    }

    .logo img.loaded + .logo-skeleton {
      display: none;
    }

    .title h1 {
      font-size: 22px;
      font-weight: 800;
      color: #ffffff;
      line-height: 1.1;
      letter-spacing: 0.3px;
    }

    .title p {
      margin-top: 3px;
      font-size: 10px;
      color: #d1d5db;
      letter-spacing: 1.6px;
      text-transform: uppercase;
    }

    .viewer-area {
      flex: 1;
      overflow: hidden;
      background: #ffffff;
    }

    .viewer-frame {
      width: 100%;
      height: 100%;
      background: #ffffff;
      overflow: hidden;
      border: none;
      box-shadow: none;
      border-radius: 0;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      background: white;
    }

    .badge {
      position: fixed;
      right: 20px;
      bottom: 18px;
      background: #111827;
      color: #ffffff;
      padding: 8px 14px;
      border-radius: 999px;
      font-size: 12px;
      box-shadow: 0 10px 24px rgba(0,0,0,0.22);
      z-index: 100;
    }

    @media (max-width: 768px) {
      .header {
        height: 58px;
      }

      .logo {
        width: 34px;
        height: 34px;
      }

      .logo img,
      .logo .logo-skeleton {
        width: 34px;
        height: 34px;
      }

      .title h1 {
        font-size: 18px;
      }

      .title p {
        font-size: 8px;
      }

      .badge {
        right: 12px;
        bottom: 12px;
        font-size: 10px;
        padding: 7px 11px;
      }

      .loading-title {
        font-size: 21px;
      }

      .loading-logo {
        width: 75px;
        height: 75px;
      }
    }
  </style>
</head>

<body>

  <!-- LOADING SCREEN -->
  <div class="loading-screen" id="loadingScreen">
    <div class="loading-box">

      <div class="loading-logo">
        <img
          class="brand-logo"
          src="https://i.ibb.co/C5XqXXx5/d2a09cd4-f07d-4034-99ad-51292342123d.png"
          alt="Cloud Init Logo"
          onload="this.classList.add('loaded')"
        />
        <div class="logo-skeleton"></div>
      </div>

      <div class="loading-title">Cloud Init AWS Notes</div>
      <div class="loading-subtitle" id="loadingSubtitle">Loading Notes...</div>

      <div class="loader-circle"></div>

      <div class="progress-wrapper">
        <div class="progress-line" id="progressLine"></div>
      </div>

      <div class="loading-percent" id="loadingPercent">0%</div>
      <div class="loading-message">Please wait, your notes are opening...</div>

    </div>
  </div>

  <!-- MAIN APP -->
  <div class="app">

    <header class="header">
      <div class="brand">

        <div class="logo">
          <img
            class="brand-logo"
            src="https://i.ibb.co/C5XqXXx5/d2a09cd4-f07d-4034-99ad-51292342123d.png"
            alt="Cloud Init Logo"
            onload="this.classList.add('loaded')"
          />
          <div class="logo-skeleton"></div>
        </div>

        <div class="title">
          <h1>Cloud Init</h1>
          <p>Cloud Learning Document</p>
        </div>

      </div>
    </header>

    <main class="viewer-area">
      <div class="viewer-frame">
        <iframe
          id="pdfFrame"
          src="https://storage.googleapis.com/abinashvideotemacces/aws.pdf#toolbar=0&navpanes=0&scrollbar=1">
        </iframe>
      </div>
    </main>

  </div>

  <div class="badge">Cloud Init Secure Reader</div>

  <script>
    const loadingScreen = document.getElementById("loadingScreen");
    const pdfFrame = document.getElementById("pdfFrame");
    const progressLine = document.getElementById("progressLine");
    const loadingPercent = document.getElementById("loadingPercent");
    const loadingSubtitle = document.getElementById("loadingSubtitle");

    // Mark any already-cached logo images as loaded immediately
    document.querySelectorAll("img.brand-logo").forEach(function (img) {
      if (img.complete && img.naturalWidth > 0) {
        img.classList.add("loaded");
      }
    });

    let progress = 0;
    let pdfLoaded = false;

    function updateProgress(value) {
      progress = value;

      if (progress > 100) {
        progress = 100;
      }

      progressLine.style.width = progress + "%";
      loadingPercent.textContent = progress + "%";
    }

    const fakeLoading = setInterval(function () {
      if (!pdfLoaded) {
        if (progress < 90) {
          progress += 3;
          updateProgress(progress);
        }
      }
    }, 180);

    pdfFrame.addEventListener("load", function () {
      pdfLoaded = true;
      loadingSubtitle.textContent = "Opening Notes...";

      clearInterval(fakeLoading);

      const finishLoading = setInterval(function () {
        progress += 5;
        updateProgress(progress);

        if (progress >= 100) {
          clearInterval(finishLoading);

          setTimeout(function () {
            loadingScreen.classList.add("hide");
          }, 700);
        }
      }, 70);
    });

    pdfFrame.addEventListener("error", function () {
      clearInterval(fakeLoading);
      loadingSubtitle.textContent = "PDF failed to load";
      loadingPercent.textContent = "Error";
    });

    document.addEventListener("contextmenu", function(event) {
      event.preventDefault();
    });

    document.addEventListener("keydown", function(event) {
      const key = event.key.toLowerCase();

      if (
        event.key === "F12" ||
        (event.ctrlKey && key === "s") ||
        (event.ctrlKey && key === "p") ||
        (event.ctrlKey && key === "u") ||
        (event.ctrlKey && event.shiftKey && key === "i") ||
        (event.ctrlKey && event.shiftKey && key === "j") ||
        (event.ctrlKey && event.shiftKey && key === "c")
      ) {
        event.preventDefault();
      }
    });
  </script>

<script src="ai-agent-widget.js"></script>
</body>
</html>
