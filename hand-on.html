<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VeeraCloud</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%;width:100%;background:#111110}
body{display:flex;justify-content:center;align-items:center;min-height:100vh;padding:2rem 1rem;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
.vc-box{display:flex;flex-direction:column;align-items:center;gap:16px;max-width:420px;text-align:center;padding:0 24px}
.vc-spinner{width:48px;height:48px;border-radius:50%;border:3px solid #2C2C2A;border-top-color:#EF9F27;animation:vc-spin 0.8s linear infinite}
@keyframes vc-spin{to{transform:rotate(360deg)}}
.vc-title{font-size:17px;font-weight:500;color:#D3D1C7}
.vc-sub{font-size:13px;color:#888780;line-height:1.6}
.vc-footer{font-size:11px;color:#444441;margin-top:8px}
</style>
</head>
<body>
  <div class="vc-box">
    <div class="vc-spinner"></div>
    <div class="vc-title">We're facing issues with the online sandbox</div>
    <div class="vc-sub">We are currently facing several issues with the online sandbox. Our team is working to improve it more strongly, and we'll inform you as soon as it's ready.</div>
    <div class="vc-footer">Powered by CloudInit · Abinash Kumar</div>
  </div>
  <script src="ai-agent-widget.js"></script>
</body>
</html>
