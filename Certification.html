<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Poppins', sans-serif;
  }

  body {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    background: #0a0e27;
    overflow: hidden;
  }

  /* Loading overlay */
  #loadingOverlay {
    display: none;
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(10, 14, 39, 0.85);
    z-index: 9999;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    gap: 16px;
  }

  #loadingOverlay.active {
    display: flex;
  }

  .spinner {
    width: 48px;
    height: 48px;
    border: 4px solid rgba(0, 212, 255, 0.2);
    border-top: 4px solid #00d4ff;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  #loadingOverlay p {
    color: #00d4ff;
    font-size: 0.95em;
    letter-spacing: 1px;
  }

  /* Side Toast Popup */
  .toast {
    position: fixed;
    bottom: 30px;
    right: -380px;
    width: 320px;
    background: rgba(15, 21, 53, 0.97);
    border: 1px solid rgba(0, 212, 255, 0.35);
    border-radius: 14px;
    padding: 16px 18px;
    display: flex;
    align-items: flex-start;
    gap: 12px;
    z-index: 99999;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
  }

  .toast-icon {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
  }

  .toast-icon.success {
    background: rgba(0, 212, 255, 0.15);
    border: 1px solid rgba(0, 212, 255, 0.4);
  }

  .toast-icon.error {
    background: rgba(220, 50, 50, 0.15);
    border: 1px solid rgba(220, 50, 50, 0.4);
  }

  .toast-icon.warning {
    background: rgba(255, 193, 7, 0.15);
    border: 1px solid rgba(255, 193, 7, 0.4);
  }

  .toast-icon svg {
    width: 18px;
    height: 18px;
  }

  .toast-body {
    flex: 1;
  }

  .toast-title {
    font-size: 0.88em;
    font-weight: 600;
    color: #fff;
    margin-bottom: 3px;
    letter-spacing: 0.3px;
  }

  .toast-msg {
    font-size: 0.78em;
    color: #8fa4d4;
    line-height: 1.45;
  }

  .toast-close {
    background: none;
    border: none;
    color: #8fa4d4;
    cursor: pointer;
    font-size: 16px;
    padding: 0;
    line-height: 1;
    flex-shrink: 0;
    transition: color 0.2s;
  }

  .toast-close:hover {
    color: #fff;
  }

  .toast-bar {
    position: absolute;
    bottom: 0;
    left: 0;
    height: 3px;
    border-radius: 0 0 14px 14px;
    width: 100%;
    background: linear-gradient(90deg, #00d4ff, #0099ff);
    transform-origin: left;
  }

  /* Error message inline */
  #errorMsg {
    display: none;
    background: rgba(220, 50, 50, 0.12);
    border: 1px solid rgba(220, 50, 50, 0.35);
    color: #ff6b6b;
    padding: 9px 14px;
    border-radius: 8px;
    font-size: 0.82em;
    width: 100%;
    text-align: center;
  }

  /* Logo */
  .logo-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    margin-bottom: 4px;
  }

  .logo-wrap img {
    width: 72px;
    height: 72px;
    border-radius: 50%;
    border: 2px solid rgba(0, 212, 255, 0.4);
    object-fit: cover;
    background: #0f1535;
    will-change: transform;
  }

  /* Background grid */
  section {
    position: absolute;
    width: 100vw;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 2px;
    flex-wrap: wrap;
    overflow: hidden;
  }

  section::before {
    content: '';
    position: absolute;
    width: 100%;
    height: 100%;
    background: linear-gradient(#0a0e27, #00d4ff, #0099ff, #0a0e27);
    animation: animate 6s linear infinite;
  }

  @keyframes animate {
    0% { transform: translateY(-100%); }
    100% { transform: translateY(100%); }
  }

  section span {
    position: relative;
    display: block;
    width: calc(6.25vw - 2px);
    height: calc(6.25vw - 2px);
    background: #0f1535;
    z-index: 2;
    opacity: 0;
  }


  /* Sign in card */
  section .signin {
    position: absolute;
    width: 400px;
    background: rgba(15, 21, 53, 0.95);
    backdrop-filter: blur(10px);
    z-index: 1000;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 36px 35px;
    border-radius: 14px;
    box-shadow: 0 25px 45px rgba(0, 0, 0, 0.5), 0 0 50px rgba(0, 212, 255, 0.2);
    border: 1px solid rgba(0, 212, 255, 0.3);
    opacity: 0;
  }

  section .signin .content {
    position: relative;
    width: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    gap: 20px;
  }

  section .signin .content h2 {
    font-size: 1.6em;
    background: linear-gradient(135deg, #00d4ff, #0099ff);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    text-transform: uppercase;
    font-weight: 700;
    letter-spacing: 1px;
  }

  /* Form */
  section .signin .content .form {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  /* Input box with proper label */
  .inputBox {
    position: relative;
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 6px;
    opacity: 0;
  }

  .inputBox label {
    font-size: 0.75em;
    color: #00d4ff;
    font-weight: 600;
    letter-spacing: 0.4px;
    padding-left: 2px;
  }

  .inputBox input[type="email"],
  .inputBox input[type="password"] {
    width: 100%;
    background: #1a2346;
    border: 2px solid rgba(0, 212, 255, 0.2);
    outline: none;
    padding: 12px 14px;
    border-radius: 10px;
    color: #fff;
    font-weight: 500;
    font-size: 0.95em;
    font-family: 'Poppins', sans-serif;
    transition: border 0.3s, background 0.3s, box-shadow 0.3s;
  }

  .inputBox input[type="email"]:focus,
  .inputBox input[type="password"]:focus {
    border: 2px solid #00d4ff;
    background: #1f2952;
    box-shadow: 0 0 0 4px rgba(0, 212, 255, 0.12);
  }

  .inputBox input[type="email"]::placeholder,
  .inputBox input[type="password"]::placeholder {
    color: #5a6a99;
    font-size: 0.9em;
  }

  /* Login button */
  .login-btn {
    position: relative;
    overflow: hidden;
    width: 100%;
    padding: 13px;
    background: linear-gradient(135deg, #00d4ff, #0099ff);
    color: #fff;
    font-weight: 700;
    font-size: 1em;
    letter-spacing: 1px;
    cursor: pointer;
    border: none;
    border-radius: 10px;
    text-transform: uppercase;
    margin-top: 6px;
    box-shadow: 0 10px 25px rgba(0, 212, 255, 0.3);
    font-family: 'Poppins', sans-serif;
  }

  .login-btn:active {
    opacity: 0.9;
  }

  .btn-ripple {
    position: absolute;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.45);
    transform: scale(0);
    pointer-events: none;
  }

  @media (max-width: 900px) {
    section span { width: calc(10vw - 2px); height: calc(10vw - 2px); }
  }

  @media (max-width: 600px) {
    section span { width: calc(20vw - 2px); height: calc(20vw - 2px); }
    section .signin { width: 90%; padding: 32px 24px; }
    .toast { width: 280px; }
  }
</style>

<script>
  /* ── GSAP entrance + interaction animations ── */
  window.addEventListener('DOMContentLoaded', () => {

    // Background tiles: staggered, randomized fade/scale reveal
    gsap.to("#bgSection span", {
      opacity: 1,
      duration: 0.6,
      ease: "power2.out",
      stagger: {
        each: 0.008,
        from: "random"
      }
    });

    // Mouse-reactive multicolor tiles: each tile near the cursor
    // flashes a different random color, then fades back to normal.
    const tileColors = [
      "#00d4ff", "#0099ff", "#7b2ff7", "#ff2d95",
      "#ff9800", "#ffea00", "#00e676", "#ff3d3d", "#3dfff0"
    ];
    let lastTile = null;

    document.getElementById("bgSection").addEventListener("mousemove", (e) => {
      const el = document.elementFromPoint(e.clientX, e.clientY);
      if (!el || el.tagName !== "SPAN" || el === lastTile) return;
      lastTile = el;

      const color = tileColors[Math.floor(Math.random() * tileColors.length)];

      gsap.killTweensOf(el);
      gsap.fromTo(el,
        { backgroundColor: color, scale: 1.12 },
        {
          backgroundColor: "#0f1535",
          scale: 1,
          duration: 1.1,
          ease: "power2.out"
        }
      );

      // splash onto a couple of neighboring tiles too, with a slight delay
      const neighbors = [
        el.previousElementSibling,
        el.nextElementSibling
      ];
      neighbors.forEach((n) => {
        if (!n || n.tagName !== "SPAN") return;
        const nColor = tileColors[Math.floor(Math.random() * tileColors.length)];
        gsap.killTweensOf(n);
        gsap.fromTo(n,
          { backgroundColor: nColor, scale: 1.06 },
          { backgroundColor: "#0f1535", scale: 1, duration: 1, ease: "power2.out", delay: 0.05 }
        );
      });
    });

    // Master entrance timeline for the sign-in card
    const tl = gsap.timeline({ defaults: { ease: "power3.out" } });

    tl.fromTo("#signinCard",
      { opacity: 0, y: 40, scale: 0.92 },
      { opacity: 1, y: 0, scale: 1, duration: 0.7 }
    )
    .fromTo("#logoImg",
      { opacity: 0, scale: 0.4, rotate: -180 },
      { opacity: 1, scale: 1, rotate: 0, duration: 0.8, ease: "back.out(1.7)" },
      "-=0.45"
    )
    .fromTo("#brandTitle",
      { opacity: 0, y: 10 },
      { opacity: 1, y: 0, duration: 0.5 },
      "-=0.4"
    )
    .fromTo(["#emailBox", "#passwordBox", "#btnBox"],
      { opacity: 0, y: 18 },
      { opacity: 1, y: 0, duration: 0.5, stagger: 0.12 },
      "-=0.25"
    );

    // Logo gentle float loop
    gsap.to("#logoImg", {
      y: -6,
      duration: 2.2,
      ease: "sine.inOut",
      repeat: -1,
      yoyo: true,
      delay: 1.4
    });

    // Card magnetic tilt on mousemove (advanced interaction)
    const card = document.getElementById("signinCard");
    card.addEventListener("mousemove", (e) => {
      const rect = card.getBoundingClientRect();
      const x = e.clientX - rect.left - rect.width / 2;
      const y = e.clientY - rect.top - rect.height / 2;
      gsap.to(card, {
        rotateY: x / 28,
        rotateX: -y / 28,
        transformPerspective: 900,
        transformOrigin: "center",
        duration: 0.4,
        ease: "power2.out"
      });
    });
    card.addEventListener("mouseleave", () => {
      gsap.to(card, { rotateY: 0, rotateX: 0, duration: 0.6, ease: "power3.out" });
    });

    // Input focus micro-interaction
    document.querySelectorAll('.inputBox input').forEach(input => {
      input.addEventListener('focus', () => {
        gsap.to(input, { scale: 1.02, duration: 0.25, ease: "power2.out" });
      });
      input.addEventListener('blur', () => {
        gsap.to(input, { scale: 1, duration: 0.25, ease: "power2.out" });
      });
    });

    // Login button hover lift + ripple click effect
    const loginBtn = document.getElementById('loginBtn');
    loginBtn.addEventListener('mouseenter', () => {
      gsap.to(loginBtn, { y: -3, boxShadow: "0 15px 35px rgba(0, 212, 255, 0.45)", duration: 0.25 });
    });
    loginBtn.addEventListener('mouseleave', () => {
      gsap.to(loginBtn, { y: 0, boxShadow: "0 10px 25px rgba(0, 212, 255, 0.3)", duration: 0.25 });
    });
    loginBtn.addEventListener('click', (e) => {
      const rect = loginBtn.getBoundingClientRect();
      const ripple = document.createElement('span');
      ripple.className = 'btn-ripple';
      const size = Math.max(rect.width, rect.height) * 1.4;
      ripple.style.width = ripple.style.height = size + 'px';
      ripple.style.left = (e.clientX - rect.left - size / 2) + 'px';
      ripple.style.top = (e.clientY - rect.top - size / 2) + 'px';
      loginBtn.appendChild(ripple);
      gsap.to(ripple, {
        scale: 1,
        opacity: 0,
        duration: 0.6,
        ease: "power2.out",
        onComplete: () => ripple.remove()
      });
    });

    // Spinner text pulse while loading
    gsap.to("#loadingText", {
      opacity: 0.4,
      duration: 0.8,
      repeat: -1,
      yoyo: true,
      ease: "sine.inOut"
    });
  });

  /* ── Toast animation via GSAP ── */
  let toastTimer = null;

  window.showToast = function (type, title, msg) {
    const toast = document.getElementById('toast');
    const icon = document.getElementById('toastIcon');
    const bar = document.getElementById('toastBar');

    document.getElementById('toastTitle').textContent = title;
    document.getElementById('toastMsg').textContent = msg;

    if (type === 'success') {
      icon.className = 'toast-icon success';
      icon.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="#00d4ff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>`;
      bar.style.background = 'linear-gradient(90deg, #00d4ff, #0099ff)';
    } else if (type === 'warning') {
      icon.className = 'toast-icon warning';
      icon.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="#ffc107" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>`;
      bar.style.background = 'linear-gradient(90deg, #ffc107, #ff9800)';
    } else {
      icon.className = 'toast-icon error';
      icon.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="#ff6b6b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>`;
      bar.style.background = 'linear-gradient(90deg, #ff6b6b, #cc3333)';
    }

    gsap.killTweensOf(bar);
    gsap.set(bar, { scaleX: 1, transformOrigin: "left" });
    gsap.to(bar, { scaleX: 0, duration: 3.5, ease: "none" });

    gsap.killTweensOf(toast);
    gsap.fromTo(toast, { x: 0 }, { x: -344, duration: 0.55, ease: "back.out(1.4)" });

    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(() => window.hideToast(), 3500);
  };

  window.hideToast = function () {
    gsap.to(document.getElementById('toast'), { x: 0, duration: 0.4, ease: "power2.in" });
  };
</script>

  const app       = initializeApp(firebaseConfig);
  const analytics = getAnalytics(app);
  const auth      = getAuth(app);

  /* ── Login ── */
  window.handleLogin = async function () {
    const email    = document.getElementById("emailInput").value.trim();
    const password = document.getElementById("passwordInput").value;
    const overlay  = document.getElementById("loadingOverlay");

    document.getElementById("errorMsg").style.display = "none";

    if (!email || !password) {
      showToast('error', 'Missing fields', 'Please enter your email and password.');
      gsap.fromTo("#signinCard", { x: -8 }, { x: 0, duration: 0.4, ease: "elastic.out(1, 0.3)" });
      return;
    }

    overlay.classList.add("active");
    gsap.fromTo(overlay, { opacity: 0 }, { opacity: 1, duration: 0.25 });

    try {
      await signInWithEmailAndPassword(auth, email, password);
      showToast('success', 'Welcome back!', 'Login successful.');
      setTimeout(() => {
        window.location.href = "https://certification-1047857993049.us-west1.run.app";
      }, 1200);
    } catch (error) {
      overlay.classList.remove("active");
      let msg = "Cloud iNIT: Authentication failed. Please try again.";
      switch (error.code) {
        case "auth/user-not-found":
        case "auth/wrong-password":
        case "auth/invalid-credential":
          msg = "Cloud iNIT: Invalid email or password."; break;
        case "auth/invalid-email":
          msg = "Cloud iNIT: Please enter a valid email address."; break;
        case "auth/too-many-requests":
          msg = "Cloud iNIT: Too many attempts. Please try again later."; break;
        case "auth/user-disabled":
          msg = "Cloud iNIT: This account has been disabled. Contact support."; break;
        case "auth/network-request-failed":
          msg = "Cloud iNIT: Network error. Check your connection and retry."; break;
      }
      showToast('error', 'Login failed', msg);
      gsap.fromTo("#signinCard", { x: -8 }, { x: 0, duration: 0.4, ease: "elastic.out(1, 0.3)" });
    }
  };

  document.addEventListener("keydown", function (e) {
    if (e.key === "Enter") window.handleLogin();
  });
</script>

</html>
